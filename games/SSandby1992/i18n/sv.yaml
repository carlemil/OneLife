    name: Märkelgraven
  recordshop:
    description: En trång second-hand-skivbutik vid Klostergatan, lådar med vinyl och en doft av damm
      och kaffe.
    name: Skivbutiken
  trailpath:
    description: Den gamla järnvägen mellan Södra Sandby och Lund, rivna och lagd som cykelväg — rak,
      plan och lång, löpande västerut genom åkrarna.
    name: Hardebergaspåret
nodes:
  cathedral:
    body: Inne väntar det stora astronomiska uret ovanför skeppet, dess små figurer frusna mitt i en processionen.
      Ett kort vid repet förklarar att det bara spelas två gånger om dagen — kungarna kommer ut, trumpeterna
      ljuder, In dulci jubilo — och nedan, förslitna trappsteg leder ner i kryptan där jätten Finn är
      fångad i sten för alltid och försöker riva ner hela kyrkan. Som barn fick du höra sagohistorien.
      Här nere är det bara kallt berg och en sorglig gammal berättelse. Din kontakt kommer här när jättarna
      kommer ut. (Vid vilken tid?)
    body_variants:
    - body: Du bestämmer dig för timmen — mittag, när kungarna processerar och trumpeterna blåser — och
        svaret sitter rätt. Myten du fick höra som barn och den mänskliga sanningen under den har samma
        form som allt det här sommaren. Finn håller sin pelare. Kryptan behåller sin köld. Du vet när
        du ska komma tillbaka.
    title: Klockan & Kryptan
  centrum:
    body: Byn centrum i det långa kvällsluset. Kiosken är fortfarande öppen, raclarna med kvällstidningar
      mjukar till i värmen. En busshållplats, en glaskiosk för telefon, och Krister — Mattias gamla kamrat
      — slängd på kiosktrappan som om han varit där sedan skolan släppte ut.
    body_variants:
    - body: Byn centrum, tystare nu. Telefonkiosken luktar fortfarande het plast och småpengar från ditt
        samtal till Lund — en röst i en studentkorridor, en tid och ett namn överenskommet. Krister sitter
        fortfarande på kiosktrappan. Vägen västerut ut ur byn väntar.
    title: Sandby Centrum
  corridor:
    body: Studentkorridor är sommartom, ett kökslys tänt. En dörr med ROBIN tejpad på sig öppnas innan
      du knackar — en musiker omkring din brors ålder, med gitarrbildningar, vaksam. "Du är lillasyskonen,"
      säger Robin lågt. "Han talar om dig hela tiden." Något i ditt bröst ger vika. (Var ärlig. Lyssna.)
    body_variants:
    - body: Robin har berättat allt för dig nu — varför Mattias verkligen gick, och breven han skrev hem
        som aldrig besvarades för din far gömmde dem. Det är mycket att hålla i en sommartyst korridor.
        Robin skriver en adress på baksidan av ditt fotografi. "Han är tio minuters promenad. Gå. Han
        har väntat mycket längre än i kväll."
    title: Robins dörr
  dad:
    body: Pappa sitter i soffan i teverutans blå flimmer, ljudet nedskruvat, en man gjord av stängda
      dörrar. Han vänder inte på huvudet. Han har inte sagt din brors namn på sex månader. Han säger
      det inte nu. "Du borde vara i sängen," är allt han erbjuder, med blicken på skärmen. (Nå honom — om du kan.)
    body_variants:
    - body: Pappa sitter med händerna platta mot knäna, ordet han slutligen gav dig — "Lund" — hänger
        fortfarande mellan er som något som tappats och inte plockas upp. Han säger inte namnet. Han säger
        inte resten. Han har vänt tillbaka till teven, men hans käke arbetar. Vad han än bär på,
        han lägger det inte ner i kväll.
    title: Pappa framför teven
  death-marlpit:
    body: Du simmar ut på samma sätt som alltid, men den här gången är du ensam och vattnet är djupare
      och mycket kallare än en sommarkväll säger. Tio meter ut sluter kylan en näve om ditt bröst och
      lerbranten lutar bort och det finns ingen på stigen som kan höra. Märgelgraven behåller vad den
      har getts, som den alltid har gjort. ▒ Du är död. ▒
    title: Kallare än det ser ut
  death-road:
    body: Du cyklar ut över huvudvägen utan att falla av, självsäker med all den sträcka som ännu återstår.
      Asfalten är varm och fälten bullrar av crickor och du hör inte bilen förrän den redan är hela världen
      — ingen tid att vara rädd, bara överraskad. Föraren såg aldrig ett barn på en olmyst cykel en sommarkväll.
      Vägen fortsätter till Lund utan dig. ▒ Du är död. ▒
    title: Väg 11
  deskbox:
    body: Arbetsrummet är mörkt; nere i hallen mullrar teven på och Pappa med den. I den nedersta lådan
      på hans skrivbord, under huvudböckerna, finns en liten stålkassa med ett fyrsiffrigt kombinationslås.
      Det här är det slag av sak man döljer när man inte vill att den ska hittas. Pappa skulle aldrig välja
      ett årtal. Men det finns ett datum han aldrig skulle skriva ner och aldrig glömma. (Fyra siffror.)
    body_variants:
    - body: De små hjulen ställs in på Mattias födelsedag och låset ger vika. Locket sitter löst i dina
        händer nu, vad som än ligger där inne är på väg att sluta vara en hemlighet.
    title: Lådan
  discovery:
    body: 'Du rensar hörnet där hans saker fortfarande ligger staplade, och två saker lossnar från högen.
      En kassett, en mixtape i hans egna blockbokstäver, inget band namngivet — bara en spårlista ner
      längs inläggskortet. Och ett fotografi: Mattias på en Lund-torg du inte känner, skrattande, en arm
      slängd omkring människor du aldrig sett. På baksidan, i hans handstil: LUND. Han ser lycklig ut.
      Han ser ut som någon med ett helt liv som du aldrig fick se. Den tysta meningen — han flyttade till
      Lund — spricker upp, och under den ligger det enda som spelar roll nu: ta reda på vad som verkligen
      hände med Mattias. Spåret löper till Lund.'
    title: Kassetten och fotot
  ending-home:
    body: Till slut kan du inte göra det — kan inte korsa de sista gatorna, kan inte knacka, kan inte
      ta reda på det. Det är sent och du är femton och Lund är mycket stort, och familjens platta mening
      är lättare att bära än vad som helst bakom den dörren. Du vänder om. Den långa vägen till Lund blir
      den långa vägen hem, och fälten stänger sig över staden bakom dig. Kanske nästa sommar. Kanske när
      du är modigare. Mattias förblir ett fotografi och en röst på ett band, en idol du aldrig tillät
      bli en person, och sanningen förblir begravd där din far la den. Du växte inte upp den här sommaren.
      Inte ännu. ▒ Slut. ▒
    title: Hemma igen
  ending-partial:
    body: 'Du sätter dig ner mittemot honom och det är verkligt — han är här, han är din bror, han kom
      till dörren för dig. Han frågar om hemma med försiktig röst och du märker att du inte vet vad du
      ska säga, för du aldrig hittade breven, och så vet du inte vad han inte vet: att han skrev, och
      skrev, och inget svar kom någonsin för din far såg till att det inte gjorde det. Så ni två talar
      runt en form som ingen av er kan se helheten av, varm och otrygg och smärtande, och under det sitter
      den gamla tystnaden på obruten. Du hittade honom. Det är mer än du hade i morse. Men ni möts som
      halv-främlingar, och långt bort i Sandby håller en stålbox i en skrivbordslåda fortfarande den del
      av historien som kunde ha gjort er hela. ▒ Slut. ▒'
    title: Halv-främlingar
  ending-true:
    body: Du berättar för honom. Om hörnet av hans rum och mixtapen och den långa vägen västerut; om Mamma
      med sitt rena diskbänk, och Pappa — och lådan i skrivbordet, och breven han skrev som aldrig kom
      förbi hans egen far. Mattias blir helt stilla, och sedan gråter han, på ett sätt du aldrig sett
      en vuxen gråta, för under sex månader trodde han att ni alla läste hans ord och valde tystnad. "Jag
      lämnade er aldrig," säger han. "Jag vill att du vet att jag aldrig lämnade er." Du vet. Du vet allt
      nu — att storebrodern på fotot var en verklig, rädd, hopplös person som blev förälskad och var tvungen
      att springa för det; och att fadern du litade på gjorde en liten, tyst, oförlåtlig sak för att hålla
      sanningen från dig. Det är inte snyggt. Robin sätter vattenkokaren på. Men tystnad är bruten, och
      du förde familjens bitar till den enda plats där de kunde sättas samman igen. Du växte upp den här
      sommaren — genom att välja honom, och sanningen, före familjens lögn. ▒ Slut. ▒
    title: Verklig återförening
  flat:
    body: 'Två trappor upp, en dörr med hans namn på ett tejpat pappersark. Bakom den, en gitarr, en lampa,
      lukten av kaffe — och Mattias, äldre och mer verklig än helgonet på fotot, som öppnar dörren för
      det lilla syskonet som kom helt vägen till Lund för att hitta honom. För ett ögonblick kan ingen
      av er tala. Sedan: hur möter du honom?'
    title: Mattias Dörr
  home:
    body: 'Din brors rum, begravet under sex månaders damm. Affischer, en bunt pocketböcker, hörnet där
      hans saker fortfarande ligger staplade. Huset andas omkring dig: mamma någonstans i köket, pappa
      i vardagsrummet med teven mumlande lågt. Hans arbetsrum, längst ner i hallen, ligger mörkt och tomt.
      Vad som än verkligen hände, det började här.'
    body_variants:
    - body: Din brors rum. Kassetten och Lund-fotot ligger i din ficka nu, och rummet känns annorlunda
        för det — mindre ett helgon, mer en första ledtråd. Mamma är i köket; pappa sitter framför teven,
        hans arbetsrum mörkt längst ner i hallen. Vägen ut ur byn — och vägen till Lund — börjar vid dörren.
    title: Mattias rum
  krister:
    body: Krister tittar upp, lite försiktig — Mattias lillasyster eller lillebror, ute här och ställer
      frågor. "Okej," säger han, och väntar för att se vad det här är. Han vet saker. Huruvida han säger
      det beror på om du är verklig med honom. (Var öppen med honom.)
    body_variants:
    - body: Krister har redan berättat vad han hade — bandet, Stilla; numret krasslat på skrapet nu i
        fickan; Sonny vid skivaffären vid Klostergatan, som vet allt om scenen. "Ta det försiktigt med
        honom, ja?" säger han, menar Mattias. "Han är inte vad din far säger att han är." Han drar sig
        inte vidare.
    title: Krister på trappan
  letters-reveal:
    body: Locket går upp. Inuti, hålla tillsammans med ett sprött gummibånd, ligger en bunt — vykort från
      Lund, tre vecklade brev, allt i Mattias handstil, alla adresserade här, till dig och till mamma,
      och alla öppnade och lästa och aldrig vidarebefordrade. Frimärkena marscherar månad för månad från
      veckan han åkte. Han skrev. Han fortsatte att skriva. Han frågade efter dig vid namn, om och om
      igen, och väntade på ett svar som din far såg till att aldrig kom. Historien var aldrig att Mattias
      övergav dig. Historien är vad som gjordes för att få dig att tro att han gjorde det.
    title: Det pappa höll
  lundcentral:
    body: Lund äntligen. Kullerstensgatorna slingrar sig mot Stortorget, och domkyrkans grå torn höjer
      sig över taken, upplysta underifrån. Det är en liten stad men efter Sandby känns det som hela världen.
      Ned från Klostergatan finns en skivbutik; upp på höjden, domkyrkan och dess krypta; och mot studentkvarteren,
      studentkorridoren där studenterna bor.
    body_variants:
    - body: Lund, och allt annorlunda nu när du vet. Domkyrkan höjer sig fortfarande över taken, lanorna
        slingrar sig fortfarande mot Stortorget — men Robin har berättat sanningen för dig, och givit
        dig en adress, och den enda gatan som spelar roll nu är den som leder till din brors dörr.
    title: Centrala Lund
  marlpit:
    body: Märkelgraven ligger stilla och grön mellan sina lerrader, bortom vägens sikte. Du och Mattias
      kom hit varje sommar — vågade varandra från höga sidan, låg i gräset efteråt, pratade om att ta
      sig ur Sandby. Han kom bort. Vattnet ser inte ut som mycket. Det gör det aldrig.
    title: Märkelgraven
  mixtape:
    body: Du drar ut inläggskortet. Inget band är namngivet någonstans — bara Mattias blockbokstavsöversikt
      över låtarna ner längs kortet. Han dolde alltid saker i öppen dager. Det finns en form på det, om
      du läser det rätt. (Vad är bandets namn?)
    body_variants:
    - body: Du läser de första bokstäverna rakt ner och bandets namn hoppar ut ur låtlistan som om det
        väntade där på dig. Stilla. Nu har du något att fråga om i Lund.
    title: Mixtapen
  mum:
    body: Mamma står vid diskbänken och torkar en yta som redan är ren. Hon vänder sig inte när du kommer
      in, men hennes axlar förskjuts — hon vet att det är du. Radion maler lågt. Det finns ett helt samtal
      som huset inte har fått ha. (Prata med henne — försiktigt.)
    body_variants:
    - body: Mamma är fortfarande vid diskbänken, men mjukare nu, trasor lagda. Hon tillät sig att minnas
        honom tillsammans med dig — släppte till och med hans födelsedag, fjortonde mars, året han föddes,
        sjuttitre. "Säg inte till din far att vi pratade," säger hon, inte okärlöst. Hon säger inte mer
        i kväll.
    title: Mamma i köket
  ostra-torn:
    body: Fälten slutar helt plötsligt. Där det var häckar och betrader finns plötsligt trottoarkanter,
      gatlyktor, de bleka betongplattorna på Östra Torns höghus — och den gamla järnvägen matar in dig
      rakt in i staden som om det alltid var meningen. Bakom dig byn och allt du blev berättat där. Framför
      dig, domkyrkans torn, och Mattias någonstans under dem. Du är inte en byunge längre. Du går in.
    title: Östra Torn
  phonescrap:
    body: Under gatlyktor glättar du ut snibben som Krister gav dig. Ett Lund-nummer i Mattias handstil
      — 046, sedan 15 78 — och sedan de två sista siffrorna bortriva, eller förslitna, eller aldrig skrivna.
      Det saknade paret är något du redan vet, om du tänker på vad som ligger i din ficka och vad mamma
      lät slinka. (Ge hela numret, eller de två saknade siffrorna.)
    body_variants:
    - body: De saknade siffrorna klickar på plats — året han föddes, sjuttiofem. 046 15 78 73. Ett Lund-nummer,
        helt nu, redo att ringa från telefonkiosken.
    title: Papperssnibben
  recordshop:
    body: En klocka över dörren. Ägaren — Sonny — står bakom disken och omsluter skivorna, och tittar
      knappt upp. "Kan jag hjälpa till?" Han sysslar med människor som vet vad de talar om. Du måste visa
      honom att du gör det. (Namnge vad du vet.)
    body_variants:
    - body: Sonny har värmt sig till dig nu när du nämnde Stilla — han har berättat att den som betydde
        något för Mattias är Robin, uppe på universitetet, i studentkorridor. "Säg Sonny hej," lägger
        han till, och går tillbaka till sina låda. "Och var snäll om det. Killen har haft det kämpigt
        med sin familj."
    title: Skivaffären
  start:
    body: 'Sommar, 1992. Du är femton år, och huset har varit alltför tyst i sex månader. Sedan Mattias
      åkte — sedan skrikandet, och sedan dörren — har familjen hållit sig till en platt mening: han flyttade
      till Lund. Mamma torkar en bänk som redan är ren. Pappa säger inte hans namn. Längre ner i hallen
      väntar din brors rum med sin dörr stängd, precis som det var. Du tror inte att han bara gick iväg
      från dig. Ikväll ska du få veta vad som verkligen hände.'
    title: Det tysta huset
  trailpath:
    body: Den gamla järnvägen löper död rak västerut genom fälten, ballast omvandlat till cykelväg under
      limträden. Ljuset blir bernsteingult och sedan grått. Någonstans framåt korsar väg 11 vägen i mörkret;
      söderut löper en körväg ner mot den gamla märgelgraven där du brukade bada. Lund är en skugga av
      ljus på horisonten.
    title: Hardebergaspåret
puzzles:
