    hint_ladder:
    - Den spelar vid tolv på dagen och igen på eftermiddagen — men legenden menar den första gången, när
      kungarna först kommer ut.
    - Slaget tolv, mitt på dagen.
    - Tolv — 12:00.
    on_solve:
      log: 'Du löste när klockan spelar: tolv, ''när jättarna kommer ut.'''
    prompt: Kortet vid den astronomiska klockan säger att figurerna processerar bara två gånger om dagen;
      kryptkällan säger att komma 'när jättarna kommer ut'. Vid vilken timme spelar klockan, för att träffa
      dina kontakt?
    solution:
      set:
      - tolv
      - '12'
      - '12:00'
      - '12.00'
      - '1200'
      - tolv
      - mittdagstid
      - klockan 12
      - kl 12
      - kl. 12
