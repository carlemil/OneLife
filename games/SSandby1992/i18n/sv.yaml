game:
  first_summary: Södra Sandby, sommaren 1992 — din brors tomma rum.
  onboarding:
    manual: "VÄGEN TILL LUND\n\nSödra Sandby, sommaren du är femton år. För sex månader sedan åkte din\
      \ större bror Mattias härifrån efter bråk med din far, och hela familjen stannade vid samma mening:\
      \ \"han flyttade till Lund.\" Du trodde aldrig på det. När du rensar hans gamla rum hittar du ett\
      \ band han gjorde och ett foto på honom i Lund tillsammans med människor du inte känner.\n\nFå reda\
      \ på vad som verkligen hände med Mattias. Spåret går till Lund.\n\n\U0001F4DD HA PENNA OCH PAPPER\
      \ NÄRA — du kommer att vilja anteckna namn, datum och lösa siffror.\nDet här är ett mysterium som\
      \ är tänkt att pusslas ihop för hand.\n\nSÅ HÄR FUNGERAR DET\n• Spelet är en ström av text. Du agerar\
      \ genom att välja vad du ska göra, tala med de människor du träffar och lösa de pussel som är vävda\
      \ in i dem.\n• Spelet håller en LOGG över allt som händer. Din logg ÄR dina framsteg — svaren på\
      \ pusslen är gömda i vad människor berättar och vad du läser.\n• Vissa människor måste PRATAS IGENOM\
      \ — säg rätt sorts sak och de öppnar sig.\n  Det finns ingen magisk fras; var mänsklig om det.\n\
      \nDÖD OCH ATT FUSKA MOT DÖDEN\n• Du är ett barn ute ensam på natten, och världen har kanter. Du\
      \ kan dö, och du kan\n  fastna. När det händer kan du FUSKA MOT DÖDEN: spola tillbaka din LOGG till\
      \ en tidigare punkt och fortsätta därifrån.\n• Att fuska mot döden är aldrig gratis: det raderar\
      \ det framsteg du gjorde efter den punkten och kostar dig positioner på RANKINGEN. Det du lärt dig,\
      \ behåller du.\n\nLäs detta, visa sedan att du har grunderna på plats."
    quiz:
    - options:
      - Din inventarier med föremål
      - Loggen över allt som händer dig
      - Din karaktärs hälsostapel
      - Antalet rum du låst upp
      prompt: Vad representerar dina framsteg?
    - options:
      - Ingenting — det är ett gratis ångrande
      - Du förlorar framsteg gjorda efter den punkten och sjunker på rankingen
      - Du får bonusframsteg för att överleva
      - Ditt konto återställs
      prompt: Vad händer när du fuskar mot döden för att fly en dålig situation?
    - options:
      - Genom att slåss med dem
      - Genom att betala dem mynt
      - Genom att prata med dem och säga rätt sorts sak
      - Genom att ignorera dem och gå förbi
      prompt: Hur kommer du huvudsakligen förbi de människor du möter?
  subtitle: Sommaren 1992. Din bror tystnade. Följ mixbandet.
  title: Vägen till Lund
gates:
  dad-silence:
    hint_ladder:
    - Han tittar inte bort från skärmen. "Gå och lägg dig."
    - Han skruvar ner ljudet ett snäpp till. "Det finns inget att prata om. Han gjorde sitt val."
    - Något i honom sprickor en bråkdel. "…Lund. Han är i Lund. Det är allt du får från mig." Han vänder
      sig tillbaka till teven.
    knowledge_boundary:
      knows:
      - att Mattias är i Lund
      refuses:
      - att säga Mattias namn högt
      - den verkliga anledningen till att Mattias lämnade, och — framför allt — att han fångade och dolde
        breven som Mattias skickade hem. Han kommer ALDRIG att erkänna att breven finns.
      tone: lakonisk, stängd, sårad stolthet och begravad skam; håller blicken på teven; avleder
    on_success:
      announce: En kort stund öppnas den stängda dörren i honom en springa. "Lund," säger han, och det
        kostar honom. "Han är i Lund." Han säger inte namnet, och han säger inte resten — han vänder sig
        tillbaka till teven, käken arbetande. (Pappa erkände bara att Mattias är i Lund.)
      log: Pappa erkände, knappast, att Mattias är i Lund — och ingenting mer.
      write_memory:
        content: Pressades av sitt yngre barn och erkände bara att Mattias är i Lund; avslöjade ingenting
          om de brev han dolde.
  krister-lead:
    hint_ladder:
    - Han rycker på axlarna. "Vet inte vad du vill att jag ska säga."
    - '"Han är inte vad din far säger, du vet. Det är allt jag säger här ute."'
    - Han gräver fram en mjuk papperslapp ur sin plånbok. "Han lämnade det här åt mig. Hälften av ett
      Lundnummer. Gå och se Sonny på skivaffären vid Klostergatan — han känner bandet."
    knowledge_boundary:
      knows:
      - Mattias hamnade tillsammans med ett Lundband som hette Stilla, och det fanns någon där nere som
        betydde något för honom
      - han behöll en papperslapp med hälften av ett Lundtelefonummer som Mattias lämnade åt honom — 046
        15 78, de sista siffrorna borta — och han ger över den
      - Sonny, som driver skivaffären vid Klostergatan, känner hela scenen
      refuses:
      - den exakta sanningen om Robin — han misstänker, men det är inte hans att berätta
      - något om familjens brev (han vet ingenting om dem)
      tone: blygsam småstadstonåring, försiktig, lojal mot Mattias, varmare än han låtsas
    on_success:
      announce: 'Krister tittar sig omkring, sedan trycker han en mjukt sliten papperslapp i din hand
        — hälften av ett Lundtelefonummer i Mattias handstil, 046 15 78 och sedan sönderrivet. "Gå och
        se Sonny, skivaffären vid Klostergatan. Han känner bandet. Och — var försiktig med Mattias, ja?"
        (Du har nu papperslappen med telefonnumret, och ett namn: Sonny.)'
      log: Krister gav dig en lapp med hälften av ett Lundtelefonummer, och pekade på Sonny på skivaffären.
      write_memory:
        content: Gav Mattias yngre syskon papperslappen med telefonnumret och skickade dem till Sonny
          på skivaffären.
  mum-birthday:
    hint_ladder:
    - Hon fortsätter att torka av bänken, vänder sig inte om. "Du borde sova."
    - Hennes händer blir stilla. "Du saknar honom också. Förstås gör du det."
    - 'Hon säger lågt, nästan för sig själv: "Min Mattias. Född fjortonde mars — sjuttioutvå, min första,
      på våren. Säg inte till din far att vi pratade."'
    knowledge_boundary:
      knows:
      - Mattias föddes fjortonde mars nittiohundrasjuttioutvå (14/3, '73), hennes förstfödde
      - att hon saknar honom och att Bengt drev honom bort och inte vill höra hans namn
      refuses:
      - att öppet kritisera eller klandra Bengt, eller något som startar ett bråk i huset
      - den verkliga anledningen till att Mattias lämnade (hon vet verkligen inte), och hon vet ingenting
        om några dolda brev
      tone: stillsam, slitad av sorg, trött; värms och minns högt om hennes barn är försiktig med henne
    on_success:
      announce: 'Hon lägger ner trasan och låter sig för första gången på sex månader minnas honom högt.
        "Min Mattias. Född fjortonde mars — nittiohundrasjuttioutvå, min första." Hon klämmer din hand.
        "Säg inte till din far att vi pratade." (Du vet nu Mattias födelsedag: 14 mars 1973.)'
      log: 'Mamma glappade till sig Mattias födelsedag: fjortonde mars, 1973.'
      write_memory:
        content: Låta hennes yngre barn trösta henne, och berättat för dem Mattias födelsedag — 14 mars
          1973.
  robin-truth:
    hint_ladder:
    - '"Han slutade aldrig prata om dig, vet du." Robin studerar dig. "Varför kom du?"'
    - '"Det finns en anledning till att han lämnade som din familj inte berättade för dig. Det är ingen
      dålig anledning. Det är bara sant."'
    - '"Han älskar mig. Det är därför han lämnade — inte för att han slutade älska dig. Och han skrev
      till dig, varje månad. Du fick aldrig breven, eller hur? Din far såg till att det blev så."'
    knowledge_boundary:
      knows:
      - Mattias lämnade Södra Sandby för att han hade blivit förälskad i Robin, och grälet med sin far
        handlade egentligen om det
      - Mattias har skrivit hem i månader — brevkort och brev — och varje enskilt intercepterades och
        göms av hans far, vilket är varför de aldrig besvarades
      - var Mattias bor nu — en lägenhet tio minuter bort — och adressen
      refuses:
      - göra det fulare än det är, eller ljuga; men själva sanningen hålls inte tillbaka för en ärlig,
        lyssnande syskon
      tone: försiktig, uppmärksam, lite misstrogen mot familjen; vänlig och försiktig med något tungt
    on_success:
      announce: 'Robin berättar allt för dig, försiktigt: att Mattias lämnade för kärleken, inte bort
        från dig; att han skrev hem månad efter månad, och att inte ett enda brev någonsin besvarades
        för att din far tog dem och göms. Robin skriver en adress på baksidan av ditt foto. "Det är tio
        minuters promenad. Gå — han har väntats mycket längre än en natt." (Du vet sanningen, och du har
        Mattias adress.)'
      log: 'Robin berättade sanningen för dig: Mattias lämnade för kärleken, och skrev hem i månader —
        brev som din far intercepterade. Du har hans adress.'
      write_memory:
        content: Berättade Mattias yngre syskon hela sanningen — kärleken, de gömda breven — och skickade
          dem till hans lägenhet.
  sonny-band:
    hint_ladder:
    - '"Skivorna är där borta. Var det något särskilt?"'
    - '"Du skulle behöva veta vad du frågar om. Jag sysslär inte med skvaller."'
    - Han lägger ner en skiva. "Stilla. Ja. Du vill ha Robin — uppe på universitetet, studentkorridor.
      Var snäll mot honom."
    knowledge_boundary:
      knows:
      - bandet Stilla, och att Mattias hängde omkring dem
      - den som verkligen betydde något för Mattias är Robin, uppe på universitetet, i studentkorridor
      refuses:
      - lös skvaller, eller att öppna sig för någon som inte kan namnge bandet
      - något om familjen eller dolda brev (han vet ingenting om dem)
      tone: lakonisk, torr, ohurtig; beskyddande av de lokala ungdomarna; mjuknar så fort någon visar
        att de hör hemma
    on_success:
      announce: Vid namnet — Stilla — tittar Sonny äntligen på dig ordentligt. "Rätt. Så du vet faktiskt
        redan." Han nickar långsamt. "Det är Robin du ska prata med. Universitetet, studentkorridor. Säg
        att Sonny hälsar — och var snäll. Det där killen har haft det tungt med sin egen familj." (Du
        vet nu att du ska hitta Robin på universitetets studentkorridor.)
      log: Sonny sa åt dig att hitta Robin på universitetets studentkorridor.
      write_memory:
        content: En kille från bandet Stilla sa åt mig att hitta Robin på universitetet.
lang: sv
