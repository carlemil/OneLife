  mixtape-cipher:
    hint_ladder:
    - Han gömmde namnet mitt framför näsan på oss. Se på bokstäverna, inte låtarna.
    - Ta första bokstaven på varje låt och stapla dem.
    - S-T-I-L-L-A. Bandet heter Stilla.
    on_solve:
      log: 'Spellistan med samma första bokstäver stavade bandets namn: STILLA.'
    prompt: Mattias mixtape har ingen bandnamn — bara en spellista. Läs första bokstaven på varje låt,
      uppifrån och ned. Vad heter bandet?
    solution:
      set:
      - STILLA
      - stilla
      - Stilla
  phone-number:
