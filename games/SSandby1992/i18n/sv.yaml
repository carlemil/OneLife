    - Det saknade paret är ett år — ett som Mamma nämnde om Mattias.
    - Han föddes nittiohundra sjuttio... tre.
    - De två sista siffrorna är 73. Numret är 046 15 78 73.
    on_solve:
      log: 'Du kompletterade Lundnumret: 046 15 78 73.'
    prompt: Kristers lapp visar 046 15 78 __ __ — de två sista siffrorna är bortrivna. Det är ett nummer
