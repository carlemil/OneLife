    name: Lunds Domkyrka & Krypta
  centrum:
    description: 'Bycentrum: en kiosk, ett buskehål, en glaskiosk med telefon och det långa sommarlljuset
      från åkrarna.'
    name: Sandby Centrum
  corridor:
    description: En studentkorridor på universitetsboendet — ett gemensamt kök, en väggtelefon, en rad
      dörrar med namn tejpade på dem.
    name: Studentkorridor
  flat:
    description: En ettorummare två trappor upp, en gitarr mot väggen, fönstret öppet mot Lunds tak.
    name: Mattias lägenhet
  home:
    description: Ett tegelhuus från 1970-talet på kanten av byn. Din bros rum är lämnat exakt som det
