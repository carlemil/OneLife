# OneLife content — Märta, the frightened girl (activates cross-character leakage).
# Demonstrates multi-file authoring: a new node here, plus a standalone edge that
# adds a route from a node defined in another file (the entrance hall).

nodes:
  - id: kbk-classroom
    pos: {x: 3478, y: 534}
    map: {x: 0.2777, y: 0.705, rx: 0.05, ry: 0.045, scale: 1.0}
    arc: main
    type: gate
    location: killebackskolan
    title: The Classroom
    gate: kbk-marta-calm
    media: {image_theme: dark-classroom, music_theme: fragile-quiet}
    body: "You follow a thin sound of crying into a darkened classroom. A girl is wedged between two desks, knees drawn to her chest. She freezes when she sees you, eyes wide. (Try to calm her enough to talk.)"
    body_variants:
      # Once you know her name, the narration uses it; until then she's "the girl".
      - when: {all: [{gate_passed: kbk-marta-calm}, {name_known: marta}]}
        body: "The classroom is quiet now. Märta sits where she was, knees drawn up, but the wildness has gone out of her eyes — she has told you what she saw, the caretaker creeping down to the boiler room in the dark. She watches you the way you watch a door you're not certain is locked."
      - when: {all: [{gate_passed: kbk-marta-calm}]}
        body: "The classroom is quiet now. The girl sits where she was, knees drawn up, but the wildness has gone out of her eyes — she has told you what she saw, the caretaker creeping down to the boiler room in the dark. She watches you the way you watch a door you're not certain is locked."
    edges:
      - id: e-classroom-leave
        to: kbk-entrance-hall
        label: Step back into the hall
        effects: {log: "You left the classroom."}
        sort_order: 9
  # --- puzzle: the chalk letters on the classroom floor (marta-anagram) ---
  - id: kbk-chalk-letters
    pos: {x: 3908, y: 726}
    arc: main
    type: puzzle
    location: killebackskolan
    title: The Chalk Letters
    puzzle: marta-anagram
    media: {image_theme: dark-classroom, music_theme: fragile-quiet}
    body: "Just inside an empty classroom, five chalk letters lie scattered across the floor as if dropped mid-word: A · R · T · M · Ä. They are waiting to be a name. (Rearrange them.)"
    body_variants:
      - when: {all: [{puzzle_solved: marta-anagram}]}
        body: "Just inside the empty classroom, the five chalk letters have been pushed into their order on the floor — MÄRTA — and the cold that hung in the corridor has eased, as if a name spoken aloud had been enough."
    edges:
      - id: e-chalk-solved
        to: kbk-entrance-hall
        label: Say the name aloud
        conditions: {all: [{puzzle_solved: marta-anagram}]}
        effects: {progress_points: 20, log: "You spoke the name, and the cold in the corridor eased a little."}
      - id: e-chalk-back
        to: kbk-entrance-hall
        label: Leave the letters where they lie
        effects: {log: "You left the chalk letters on the floor."}
        sort_order: 9

# Standalone edges attach to a node defined anywhere (here: the entrance hall).
