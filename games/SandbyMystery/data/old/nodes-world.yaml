# OneLife world — the cell grid and travel between places (WORLD_AND_MAPS.md).
# Setting is southern Sweden, 1992. The year is fixed; traveling changes the
# place (and therefore the atmosphere soundtrack), never the year.

nodes:
  - id: sandby-street
    pos: {x: 3174, y: 338}
    map: {x: 0.4017, y: 0.5623, rx: 0.05, ry: 0.045, scale: 1.0}
    arc: main
    type: location
    location: sandby-street
    title: Sandby Street
    world_access: true
    media: {image_theme: village-street-dusk, music_theme: hushed-village, real_place: "the village of Södra Sandby, Skåne, Sweden"}
    body: "Sandby's main street lies dark and empty beyond the school, streetlamps buzzing against the rain. The village is silent, but roads lead away into the wider night — toward Lund, and toward Malmö and the water."
    edges:
      - id: e-street-inside
        road: [[0.7305, 0.2886], [0.733, 0.2913]]
        to: kbk-entrance-hall
        label: Climb back in through the broken window
        effects: {log: "You went back into the school."}
  - id: lund-square
    pos: {x: 2124, y: 1253}
    map: {scale: 1.5}
    arc: main
    type: location
    location: lund-square
    title: Cathedral Square
    world_access: true
    media: {image_theme: city-square-dusk, music_theme: cathedral-cold, real_place: "Lund Cathedral, Lund, Sweden", reference_image: "https://upload.wikimedia.org/wikipedia/commons/a/aa/Lunds_domkyrka_augusti_2012.jpg"}
    body: "Lund's cathedral looms over the empty square, its twin towers lost in low cloud. Cobblestones glisten. A side street leads down toward the railway station."
    edges:
      - id: e-square-station
        road: [[0.5611, 0.4164], [0.5628, 0.4123]]
        to: lund-station
        label: Walk down to the station
        effects: {progress_points: 5, log: "You walked to Lund station."}
  - id: lund-station
    pos: {x: 2378, y: 1067}
    map: {x: 0.6512, y: 0.7299, rx: 0.05, ry: 0.045, scale: 1.0}
    arc: main
    type: location
    location: lund-station
    title: Lund Station
    media: {image_theme: station-night, music_theme: distant-trains, real_place: "Lund Central Station, Sweden", reference_image: "https://upload.wikimedia.org/wikipedia/commons/c/cf/Lunds_centralstation2007.jpg"}
    body: "The station is shuttered for the night. A single departures board flickers a timetable for trains that have long since gone. The square is back up the hill."
    body_variants:
      - when: {all: [{puzzle_solved: last-train-time}]}
        body: "The station is still shuttered, but the departures board no longer flickers — it holds the single time you settled it on, and one platform light burns steady down the empty track. The square is back up the hill."
    edges:
      - id: e-station-square
        road: [[0.5628, 0.4123], [0.5611, 0.4164]]
        to: lund-square
        label: Back up to the cathedral square
        effects: {log: "You returned to the square."}

# Standalone edge: leave the school for the village street (a world-access node).
