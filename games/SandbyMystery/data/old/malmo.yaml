gates:
  - id: malmo-zoltan
    location: malmo-rosengard
    character: zoltan_ibrahimson
    intent: Earn the big man's respect so he gives you a name moving through the harbour.
    criteria:
      - {id: showed_spine, desc: "Player stands up to him with confidence or humour — neither grovels nor disrespects him."}
      - {id: asked_for_help, desc: "Player asks him for a name, for help, or about what moves through the harbour."}
    success_rule: "showed_spine AND asked_for_help"
    knowledge_boundary:
      knows:
        - "he knows everyone in Malmö and who moves what through the old harbour"
        - "a name connected to the locked harbour locker, and that it leads back toward Sandby"
      refuses:
        - "the debts people owe him"
        - "the larger mystery of why the stranger is here"
      tone: "booming, boastful, third person ('Zoltan does not wait'); the bragging hides real loyalty"
    hint_ladder:
      - "He keeps the ball moving and watches how you carry yourself."
      - "\"Zoltan helps people he respects. So — do you flinch, or do you talk?\""
      - "\"You want the harbour locker. Zoltan knows the name on it. Stand up straight, ask Zoltan properly, and it's yours.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_zoltan
      story_node_next: malmo-rosengard
      log: "Zoltan respected you enough to hand over the name on the harbour locker."
      write_memory: {owner: zoltan_ibrahimson, content: "A stranger came to Rosengård with spine, so Zoltan gave them the name on the harbour locker — the one that leads back to Sandby.", leakable: true}

  - id: malmo-lisbet
    location: malmo-server-basement
    character: lisbet_salamander
    intent: Give the hacker a reason not to throw you out, and learn what she dug up on the 1998 fire.
    criteria:
      - {id: was_direct, desc: "Player gets to the point — no small talk, no flattery, no wasting her time."}
      - {id: offered_trade_or_question, desc: "Player offers a real trade or asks a precise, specific question."}
    success_rule: "was_direct AND offered_trade_or_question"
    knowledge_boundary:
      knows:
        - "she pulled the records on the 1998 school fire and a name had been scrubbed from the file by someone official"
        - "she can find anyone from almost nothing — including who the stranger has been"
      refuses:
        - "her methods and her sources"
        - "the larger mystery of why the stranger is here"
      tone: "clipped, distrustful, scalding when she does open up; hates small talk and flattery"
    hint_ladder:
      - "She keeps typing, one eyebrow up, waiting for you to bore her."
      - "\"Trade or question. Pick one. Don't make me wait.\""
      - "\"The 1998 fire file? Somebody scrubbed a name out of it. Give me something real and I'll tell you whose it was.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_lisbet
      story_node_next: malmo-server-basement
      log: "Lisbet showed you the scrubbed name in the 1998 fire file."
      write_memory: {owner: lisbet_salamander, content: "A stranger was direct enough not to annoy me, so I showed them the name someone scrubbed out of the 1998 school-fire file.", leakable: true}

  - id: malmo-vallmo
    location: malmo-police
    character: kurt_vallmo
    intent: Win the tired detective's trust so he tells you about the case he never closed and the missing fire file.
    criteria:
      - {id: was_straight, desc: "Player is honest and patient with him, not evasive or pushy."}
      - {id: asked_about_case, desc: "Player asks about an old case, the disappearance, or the 1998 fire."}
    success_rule: "was_straight AND asked_about_case"
    knowledge_boundary:
      knows:
        - "the Lund disappearance he was made to drop, and that he never believed it was nothing"
        - "the 1998 school-fire file was signed out of the archive and never came back"
      refuses:
        - "naming a suspect he can't prove"
        - "the larger mystery of why the stranger is here"
      tone: "tired, blunt, melancholic; circles the same question until something cracks; mutters in Scanian"
    hint_ladder:
      - "He rubs his eyes and waits to see if you're worth the coffee he's not offering."
      - "\"Be straight with me. I've had thirty years of people who weren't.\""
      - "\"There was a disappearance in Lund they made me drop. And the '98 fire file — somebody signed it out and it never came back. Ask me plain and I'll tell you what I kept.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_vallmo
      story_node_next: malmo-police
      log: "Vallmo told you about the case he never closed and the fire file that vanished."
      write_memory: {owner: kurt_vallmo, content: "A stranger was straight with me, so I told them about the Lund disappearance I was made to drop and the 1998 fire file that was signed out and never returned.", leakable: true}
