# OneLife content — Malmö, a new city cell west of Lund, with a word-lock puzzle.
# Shows the world growing (fog-of-war reveals it when you reach Lund) and a
# `set`-solution puzzle (several accepted answers) beyond the school.

cells:
  - id: malmo
    map: {x: 0.1963, y: 0.71, rx: 0.09, ry: 0.07}
    world_exit: {x: 0.9008, y: 0.8861, rx: 0.06, ry: 0.05}
    grid_x: 1
    grid_y: 3
    name: Malmö
    kind: city
    region: "Malmö, Skåne"
    arrival_node: malmo-harbor

locations:
  - id: malmo-harbor
    name: The Harbour
    cell: malmo
    description: "Malmö's old harbour, cranes black against the Öresund."
    icon_description: "An old industrial harbour with tall black dockside cranes and iron bollards along a stone quay, a large ship on the dark water beyond."
  - id: malmo-crossing
    name: The End of the Pier
    cell: malmo
    description: "A long pier running out into the Öresund, walkable only once the fog draws back."
    icon_description: "A long wooden pier on tall pilings running far out across the sea, its far end fading into the fog."
  - id: malmo-locker
    name: Harbour Lockers
    cell: malmo
    description: "A row of dented harbour storage lockers, salt-rusted."
    icon_description: "A row of dented, salt-rusted metal harbour storage lockers."
  - id: malmo-rosengard
    name: Rosengård
    cell: malmo
    description: "Concrete estates and a floodlit cage pitch on the city's edge."
    icon_description: "A cluster of plain concrete apartment blocks behind a floodlit, fenced cage football pitch."
  - id: malmo-server-basement
    name: The Basement Server Room
    cell: malmo
    description: "A fan-roaring cellar of humming racks beneath a dead shopfront."
    icon_description: "A shuttered dead shopfront with a basement glimpsed below, full of blinking server racks and tangled cables."
  - id: malmo-police
    name: Police Headquarters
    cell: malmo
    description: "A strip-lit night office that smells of cold coffee and old paper."
    icon_description: "A boxy mid-century police headquarters building with rows of lit office windows and a lamp over the entrance."
  - id: malmo-stortorget
    name: Stortorget
    cell: malmo
    description: "Malmö's vast main square, a bronze king on horseback at its centre."
    icon_description: "A vast cobbled square with an ornate bronze equestrian statue of a king on horseback on a tall plinth at its centre, grand facades around it."
  - id: malmo-lilla-torg
    name: Lilla Torg
    cell: malmo
    description: "A small timbered square of shuttered bars off the main one."
    icon_description: "A small cobbled square ringed by half-timbered houses with steep tiled roofs and shuttered windows."
  - id: malmo-castle
    name: Malmöhus Castle
    cell: malmo
    description: "A squat moated fortress and former prison, black water in the moat."
    icon_description: "Malmöhus Castle: a squat red-brick renaissance fortress with round corner towers, ringed by a moat of dark water."
  - id: malmo-turning-torso
    name: The Turning Torso
    cell: malmo
    description: "A tower that twists as it rises over the Western Harbour."
    icon_description: "A tall white skyscraper that twists as it rises, a spiralling tower of stacked cubes."
  - id: malmo-pildamms
    name: Pildammsparken
    cell: malmo
    description: "A dark lakeside park of reeds and paths that double back on you."
    icon_description: "A dark lakeside park: still black water fringed with tall reeds and winding paths under a few bare trees."
  - id: malmo-cemetery
    name: The Old Cemetery
    cell: malmo
    description: "Gamla kyrkogården: leaning stones and fog pooling between the limes."
    icon_description: "An old cemetery of leaning weathered gravestones and a stone cross beneath bare lime trees, fog pooling between them."
  - id: malmo-citytunnel
    name: Triangeln Station
    cell: malmo
    description: "A deep underground platform, tiled and silent, far below the streets."
    icon_description: "A round tiled tunnel mouth descending underground to a deep railway platform, a single track vanishing into the dark."

nodes:
  - id: malmo-harbor
    pos: {x: 548, y: 2030}
    map: {x: 0.6512, y: 0.1729, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-harbor
    title: The Harbour
    world_access: true
    media: {image_theme: harbor-night, music_theme: distant-trains, real_place: "the old industrial harbour of Malmö, Sweden, dockside cranes against the Öresund"}
    body: "Malmö's old harbour. Cranes stand black against the Öresund and the water slaps at the quay. A road runs back inland toward Lund."
    # Once every puzzle across Skåne is solved, the fog the player named on the
    # harbour wall draws back for good and the long pier out to the water opens —
    # the way to the final crossing (the e-harbor-crossing edge unlocks with it).
    body_variants:
      - when: {all: [{flag_set: knows_real_exit}, {flag_set: solved_marta_anagram}, {flag_set: solved_church_bell}, {flag_set: solved_dodblek_games}, {flag_set: solved_shadow}, {flag_set: solved_last_train}, {flag_set: solved_candle}, {flag_set: solved_elder}, {flag_set: opened_harbor_locker}, {flag_set: solved_fog}, {flag_set: solved_gravestone}, {flag_set: solved_ystad_lock}]}
        body: "Malmö's old harbour. The fog you named off the Öresund has pulled back for good now and does not close again, and a long pier you are certain was not walkable before runs straight out toward the far shore and its small, steady lights. The cranes stand still. The water no longer slaps so much as waits. A road runs back inland toward Lund."
    edges:
      - id: e-harbor-lockers
        to: malmo-locker
        label: Search the harbour lockers
        effects: {progress_points: 5, log: "You went to the harbour lockers."}

  - id: malmo-locker
    pos: {x: 177, y: 1973}
    arc: main
    type: puzzle
    location: malmo-locker
    title: Harbour Lockers
    puzzle: harbor-locker
    media: {image_theme: harbor-night, music_theme: low-dread}
    body: "Most lockers hang open and empty. One is held by a word-lock — five letter dials."
    body_variants:
      - when: {all: [{puzzle_solved: harbor-locker}]}
        body: "Most lockers hang open and empty. The one that held the word-lock stands open now too — and the child's photograph that was inside it is in your hands, the face almost, almost one you know."
    edges:
      - id: e-locker-opened
        to: malmo-harbor
        label: Take what's inside and go
        conditions: {all: [{puzzle_solved: harbor-locker}]}
        effects: {progress_points: 20, log: "Inside the locker: a child's photograph you almost recognize."}
      - id: e-locker-back
        to: malmo-harbor
        label: Step back to the quay
        effects: {log: "You stepped back to the quay."}
        sort_order: 9

  # --- Zoltan Ibrahimson: Rosengård ---
  - id: malmo-rosengard
    pos: {x: -134, y: 1662}
    map: {x: 0.7818, y: 0.68, rx: 0.05, ry: 0.045}
    arc: main
    type: gate
    location: malmo-rosengard
    title: Rosengård
    gate: malmo-zoltan
    media: {image_theme: estate-floodlight, music_theme: night-bass, real_place: "the Rosengård housing estate, Malmö, Sweden", reference_image: "https://upload.wikimedia.org/wikipedia/commons/9/9a/Roseng%C3%A5rd_2009.png"}
    body: "Concrete towers box in a floodlit cage pitch where a ball still cracks off the boards after midnight. An enormous ponytailed man holds the court alone, scarred eyebrow, expensive coat thrown over the fence. He nutmegs an invisible defender and grins at you. \"You came to Zoltan's part of town. Brave. Or lost.\" (Show some spine — he has no use for grovelling.)"
    body_variants:
      - when: {all: [{gate_passed: malmo-zoltan}]}
        body: "Concrete towers box in the floodlit cage pitch. Zoltan still holds the court alone, but he greets you now like a debt already settled — he has given you the name off the harbour locker, the one that leads back to Sandby. \"Zoltan does not forget a face with spine,\" he says, and sends the ball cracking up off the boards."
    edges:
      - id: e-rosengard-harbor
        to: malmo-harbor
        label: Head back down toward the harbour
        effects: {log: "You left Rosengård."}
        sort_order: 9

  # --- Lisbet Salamander: the server basement ---
  - id: malmo-server-basement
    pos: {x: 1300, y: 2407}
    map: {x: 0.2959, y: 0.6687, rx: 0.05, ry: 0.045}
    arc: main
    type: gate
    location: malmo-server-basement
    title: The Basement Server Room
    gate: malmo-lisbet
    media: {image_theme: server-glow, music_theme: fan-hum}
    body: "Behind a dead shopfront, stairs drop into a roar of cooling fans and racks blinking green in the dark. A small wiry woman sits cross-legged before six screens, headphones on, a salamander inked up her neck. She doesn't turn. \"I already know your login, your debt, and the time you got here. Say something I don't know, fast.\" (Be direct — she despises wasted time.)"
    body_variants:
      - when: {all: [{gate_passed: malmo-lisbet}, {name_known: lisbet_salamander}]}
        body: "The fans still roar and the racks blink green in the dark. Lisbet hasn't turned from her six screens, but she's already given you what you came for — the name someone scrubbed out of the 1998 fire file. \"You're still here,\" she says flatly. \"I told you what I found. Don't make it weird.\""
      - when: {all: [{gate_passed: malmo-lisbet}]}
        body: "The fans still roar and the racks blink green in the dark. The hacker hasn't turned from her six screens, but she's already given you what you came for — the name someone scrubbed out of the 1998 fire file. \"You're still here,\" she says flatly. \"I told you what I found. Don't make it weird.\""
    edges:
      - id: e-basement-harbor
        to: malmo-harbor
        label: Back up the stairs to the street
        effects: {log: "You left the basement and its screens."}
        sort_order: 9

  # --- Kurt Vallmo: police HQ ---
  - id: malmo-police
    pos: {x: 1206, y: 1436}
    map: {x: 0.7669, y: 0.3563, rx: 0.05, ry: 0.045}
    arc: main
    type: gate
    location: malmo-police
    title: Police Headquarters
    gate: malmo-vallmo
    media: {image_theme: night-office, music_theme: low-dread, real_place: "a night-shift detective's office in a Swedish police station, paperwork and a murder board"}
    body: "One window still burns on the upper floor of the police house. Inside, a heavy, rumpled detective sits alone at a desk drowned in folders, a murder board behind him stuck with a single old case. He doesn't get up; his stomach growls into the quiet. \"We're closed. But you've got the look of somebody who knows something I've been chewing on for years. Sit.\" (Be straight with him — he's too tired for games.)"
    body_variants:
      - when: {all: [{gate_passed: malmo-vallmo}, {name_known: kurt_vallmo}]}
        body: "One window still burns on the upper floor. Vallmo sits where you left him among his folders and the one old case on the board — but he's said his piece now: the disappearance they made him drop, the fire file signed out and never returned. He watches you with tired, unguarded eyes, a battered evidence box now set out at his elbow."
      - when: {all: [{gate_passed: malmo-vallmo}]}
        body: "One window still burns on the upper floor. The rumpled detective sits where you left him among his folders and the one old case on the board — but he's said his piece now: the disappearance they made him drop, the fire file signed out and never returned. He watches you with tired, unguarded eyes, a battered evidence box now set out at his elbow."
    edges:
      - id: e-police-harbor
        to: malmo-harbor
        label: Leave the detective to his folders
        effects: {log: "You left the police house."}
        sort_order: 9

  # --- atmosphere ---
  - id: malmo-stortorget
    pos: {x: 1013, y: 2077}
    map: {x: 0.3818, y: 0.5555, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-stortorget
    title: Stortorget
    media: {image_theme: empty-square-night, music_theme: wind-cold, real_place: "Stortorget, the great main square of Malmö, Sweden, with the bronze equestrian statue of King Karl X Gustav", reference_image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Stortorget_in_Malm%C3%B6%2C_Sweden.jpg/3840px-Stortorget_in_Malm%C3%B6%2C_Sweden.jpg"}
    body: "The great square opens out, far too large for the few lit windows around it. A bronze king rides his bronze horse at the centre, green with age, facing nothing. Wind comes straight off the water and worries at the flags. Smaller streets lead off toward a older, tighter square."
    edges:
      - id: e-stortorget-harbor
        to: malmo-harbor
        label: Back toward the harbour road
        effects: {log: "You left Stortorget."}
        sort_order: 9
      - id: e-stortorget-lilla
        to: malmo-lilla-torg
        label: Slip into the little timbered square
        effects: {progress_points: 3, log: "You crossed to Lilla Torg."}

  - id: malmo-lilla-torg
    pos: {x: 1343, y: 1865}
    map: {x: 0.5421, y: 0.4083, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-lilla-torg
    title: Lilla Torg
    media: {image_theme: timbered-square, music_theme: distant-laughter, real_place: "Lilla Torg, the small cobbled half-timbered square in Malmö, Sweden", reference_image: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Lilla_Torg%2C_Malm%C3%B6%2C_mars_2015-3.jpg"}
    body: "Crooked timbered houses lean over a cobbled square of shuttered bars and stacked, chained chairs. Somewhere a knot of laughter rises — and stops the moment you look for it. Heat-lamps stand cold. The big square is back the way you came."
    edges:
      - id: e-lilla-stortorget
        to: malmo-stortorget
        label: Back out to the great square
        effects: {log: "You returned to Stortorget."}
        sort_order: 9

  - id: malmo-castle
    pos: {x: 722, y: 1400}
    map: {x: 0.1719, y: 0.5895, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-castle
    title: Malmöhus Castle
    media: {image_theme: moated-fortress, music_theme: dread-drone, real_place: "Malmöhus Castle, Malmö, Sweden, a squat red-brick renaissance fortress with round towers and a moat", reference_image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Malm%C3%B6hus_slott_2022.jpg/3840px-Malm%C3%B6hus_slott_2022.jpg"}
    body: "The fortress squats low behind its moat, more prison than palace, its brick the colour of dried blood under the floodlights. Black water rings it without a ripple. A footbridge crosses to a gate that is, just slightly, ajar. You think of everyone this place was built to keep in."
    edges:
      - id: e-castle-harbor
        to: malmo-harbor
        label: Recross the bridge and go
        effects: {log: "You left the castle behind its moat."}
        sort_order: 9

  - id: malmo-turning-torso
    pos: {x: 255, y: 1723}
    map: {x: 0.0876, y: 0.7117, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-turning-torso
    title: The Turning Torso
    media: {image_theme: twisting-tower, music_theme: high-cold, real_place: "the Turning Torso skyscraper, Malmö, Sweden, a white tower that twists as it rises", reference_image: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Turning_Torso2.jpg"}
    body: "Out at the Western Harbour a white tower screws up into the low cloud, each storey wrung a little further round than the last, as if something had taken the building and slowly twisted it. Every window is dark but one, very high up, where a light moves once and is still. The wind off the sound is bitter."
    edges:
      - id: e-torso-harbor
        to: malmo-harbor
        label: Turn back from the water's edge
        effects: {log: "You left the twisting tower."}
        sort_order: 9

  - id: malmo-pildamms
    pos: {x: 329, y: 2833}
    map: {x: 0.2645, y: 0.825, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-pildamms
    title: Pildammsparken
    media: {image_theme: dark-park-lake, music_theme: reeds-wind, real_place: "Pildammsparken, a large lakeside park in Malmö, Sweden, reeds and dark water", reference_image: "https://upload.wikimedia.org/wikipedia/commons/8/89/Pildammarna%2C_Malm%C3%B6.jpg"}
    body: "Gravel paths wind into a park grown too dark, reeds hissing at the edge of a black lake. You follow a path you're sure you've walked already and it sets you down somewhere new. The lamps are spaced just too far apart. Water lies flat and waiting between the trees."
    edges:
      - id: e-pildamms-harbor
        to: malmo-harbor
        label: Find your way back out of the park
        effects: {log: "You left the park, eventually."}
        sort_order: 9

  - id: malmo-cemetery
    pos: {x: 229, y: 2281}
    arc: main
    type: location
    location: malmo-cemetery
    title: The Old Cemetery
    media: {image_theme: foggy-graveyard, music_theme: funeral-cold, real_place: "Gamla kyrkogården, the old cemetery in Malmö, Sweden, leaning gravestones under lime trees"}
    body: "The old cemetery runs on under rows of limes, its stones leaning together like people sharing a secret. Fog pools in the hollows and gives the names back to you one at a time. Some plots are tended fresh; you do not see by whom. The gate to the living streets is somewhere behind you."
    edges:
      - id: e-cemetery-harbor
        to: malmo-harbor
        label: Back through the gate to the streets
        effects: {log: "You left the old cemetery."}
        sort_order: 9

  - id: malmo-citytunnel
    pos: {x: 1324, y: 1715}
    map: {x: 0.5174, y: 0.868, rx: 0.05, ry: 0.045}
    arc: main
    type: location
    location: malmo-citytunnel
    title: Triangeln Station
    media: {image_theme: deep-platform, music_theme: tunnel-hum, real_place: "Triangeln station, the deep underground Citytunnel station in Malmö, Sweden, tiled platform"}
    body: "An escalator carries you far down into the earth to a tiled platform lit white and even, utterly silent. The departures sign holds a single train, due in one minute, that the minute never reaches. Warm air pushes out of the tunnel mouth as if something large just exhaled. The way up is a long bright climb."
    edges:
      - id: e-citytunnel-harbor
        to: malmo-harbor
        label: Ride the long escalator back up
        effects: {log: "You climbed back up out of the tunnel."}
        sort_order: 9

  # --- puzzle: the riddle scratched into the harbour wall (fog-riddle) ---
  - id: malmo-harbor-fog
    pos: {x: 742, y: 1730}
    arc: main
    type: puzzle
    location: malmo-harbor
    title: The Scratched Riddle
    puzzle: fog-riddle
    media: {image_theme: harbor-night, music_theme: distant-trains}
    body: "Someone has scratched a riddle deep into the harbour wall, the letters furred with salt. As you read it the grey comes rolling in off the Öresund and the cranes begin to disappear. (Answer the riddle.)"
    body_variants:
      - when: {all: [{puzzle_solved: fog-riddle}]}
        body: "The riddle is still scratched deep into the harbour wall, furred with salt — but you have named the thing it asked for, and for a moment the grey thinned and gave back the far shore before quietly closing over it again."
    edges:
      - id: e-harbor-fog-solved
        to: malmo-harbor
        label: The word hangs in the air — walk on
        conditions: {all: [{puzzle_solved: fog-riddle}]}
        effects: {progress_points: 15, log: "You named the fog, and for a moment it thinned to show the far shore."}
      - id: e-harbor-fog-back
        to: malmo-harbor
        label: Step back from the wall
        effects: {log: "You left the scratched riddle to the salt."}
        sort_order: 9

  # --- puzzle: the blank gravestone (gravestone-sum) ---
  - id: malmo-cemetery-stones
    pos: {x: -134, y: 2209}
    arc: main
    type: puzzle
    location: malmo-cemetery
    title: The Blank Stone
    puzzle: gravestone-sum
    media: {image_theme: foggy-graveyard, music_theme: funeral-cold}
    body: "Three stones stand in a row, newer than their leaning neighbours — and one is blank where a death-year should be, the chalk of an unfinished hand still on it. The fog gives up the dates one at a time. (Read them and give the missing year.)"
    body_variants:
      - when: {all: [{puzzle_solved: gravestone-sum}]}
        body: "Three stones stand in a row, newer than their leaning neighbours. The blank one is finished now, the missing year chalked in by your own hand, and the fog that pooled over the plot has drawn quietly back from the three of them."
    edges:
      - id: e-cemetery-stones-solved
        to: malmo-cemetery
        label: Chalk the year and step back
        conditions: {all: [{puzzle_solved: gravestone-sum}]}
        effects: {progress_points: 15, log: "You finished the blank stone, and the fog over the plot drew back."}
      - id: e-cemetery-stones-back
        to: malmo-cemetery
        label: Leave the stones unread
        effects: {log: "You left the three stones to the fog."}
        sort_order: 9

  # --- puzzle: Vallmo's evidence-box word-lock (ystad-wordlock), once you've met him ---
  - id: malmo-vallmo-lock
    pos: {x: 1510, y: 1409}
    arc: main
    type: puzzle
    location: malmo-police
    title: The Evidence Box
    puzzle: ystad-wordlock
    media: {image_theme: night-office, music_theme: low-dread}
    body: "Vallmo slides a battered evidence box across the desk, shut with a five-dial word-lock. \"Spells the town where it started,\" he says, not quite meeting your eye. \"I never could bring myself to open it.\" (Set the dials.)"
    body_variants:
      - when: {all: [{puzzle_solved: ystad-wordlock}]}
        body: "The evidence box sits open between you, the five-dial lock sprung. Vallmo stares at what was inside and says nothing for a long while; whatever he had hoped wasn't true, plainly was."
    edges:
      - id: e-lock-solved
        to: malmo-police
        label: Set the dials
        conditions: {all: [{puzzle_solved: ystad-wordlock}]}
        effects: {progress_points: 15, log: "The lock gave. Vallmo stared at what was inside and said nothing for a long while."}
      - id: e-lock-back
        to: malmo-police
        label: Push the box back across the desk
        effects: {log: "You left the box shut."}
        sort_order: 8

  # --- THE ENDING: the crossing at the end of the harbour pier. Reachable only
  # once every puzzle in the game is solved (see e-harbor-crossing's conditions),
  # so the whole journey through Sandby, Lund and Malmö leads here.
  - id: malmo-crossing
    pos: {x: 699, y: 2303}
    arc: main
    type: ending
    location: malmo-crossing
    title: The Crossing
    media: {image_theme: harbor-night, music_theme: revelation, real_place: "the very end of a long pier in Malmö harbour at night, the fog pulled back over the Öresund to reveal the lights of the far shore"}
    body: "You walk out to the very end of the pier, where the water could never let you go before. The fog you named on the harbour wall draws back across the Öresund and does not close again — and there at last is the far shore, its lights small and steady and waiting. Everything you gathered tonight lies quiet in you now: the bricked door and the broken window, the burned year 1998, the name scrubbed from the file, the tall man and the small thing he carried out of the smoke. You take the child's photograph from the harbour locker and hold it up to the grey light off the water, and you stop pretending you do not know the face in it. It is yours. It was always yours — the child who never got out, come back the long way round to gather the whole of it. A low boat knocks against the pilings, no one at the tiller, and you understand it has been waiting here for you since the night the school burned. You step down into it. The far shore does not come nearer so much as the near one, gently, lets you go. ▒ End. ▒"

puzzles:
  - id: harbor-locker
    type: set
    prompt: "A five-letter word-lock. What word fits?"
    solution: {kind: set, set: [SANDBY, SKANE, SKÅNE]}
    hint_ladder:
      - "A place name. Five letters."
      - "Somewhere this all began."
      - "Try SANDBY."
    on_solve: {progress_points: 30, set_flag: opened_harbor_locker, log: "The word-lock springs open."}

# Standalone edges off the harbour hub (malmo-harbor, world_access).
edges:
  # The final crossing — unlocks only when every puzzle in the game is solved.
  - id: e-harbor-crossing
    from: malmo-harbor
    to: malmo-crossing
    label: Walk out to the end of the pier, where the fog has drawn back at last
    conditions: {all: [{flag_set: knows_real_exit}, {flag_set: solved_marta_anagram}, {flag_set: solved_church_bell}, {flag_set: solved_dodblek_games}, {flag_set: solved_shadow}, {flag_set: solved_last_train}, {flag_set: solved_candle}, {flag_set: solved_elder}, {flag_set: opened_harbor_locker}, {flag_set: solved_fog}, {flag_set: solved_gravestone}, {flag_set: solved_ystad_lock}]}
    effects: {progress_points: 40, log: "You walked out to the end of the pier. The fog had drawn back, and the far shore was waiting."}
    sort_order: 1
  - id: e-harbor-rosengard
    from: malmo-harbor
    to: malmo-rosengard
    label: Take the road up to the Rosengård estates
    effects: {progress_points: 5, log: "You went up to Rosengård."}
