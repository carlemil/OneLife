# OneLife content — Södra Sandby deepened beyond the school: three sub-locations
# reached from Sandby Street (the village world-access hub in world.yaml), each
# home to one of the roster NPCs. Side-content off the main spine; every node has
# a return edge to the hub so the spine lint stays trap-free.

locations:
  - id: sandby-church
    name: Sandby Church
    cell: sandby
    description: "The old whitewashed church of the village, its graveyard sloping into mist."
    icon_description: "A medieval whitewashed Scanian stone church with a stepped gable tower and a sloping graveyard of crosses."
  - id: sandby-quarry
    name: The Gravel-Pit Lake
    cell: sandby
    description: "A flooded quarry east of the village, and a half-dead motel beside it."
    icon_description: "A flooded gravel-pit quarry lake with steep gravel banks and a half-derelict roadside motel beside the water."
  - id: sandby-crooked-house
    name: The Crooked House
    cell: sandby
    description: "A leaning house at the very edge of Sandby, where the streetlamps give out."
    icon_description: "A small crooked old house at the village edge, walls tilted and chimney bent, the last streetlamp leaning beside it."

nodes:
  # --- Herr Dödblek: the churchyard ---
  - id: sandby-church
    pos: {x: 2689, y: 395}
    map: {x: 0.4132, y: 0.3789, rx: 0.05, ry: 0.045}
    arc: main
    type: gate
    location: sandby-church
    title: Sandby Church
    gate: sandby-dodblek
    media: {image_theme: church-graveyard-night, music_theme: funeral-cold, real_place: "Södra Sandby church, a medieval whitewashed Scanian stone church and graveyard, Sweden"}
    body: "The church door stands open on cold air and faded lime-painted saints. Out among the leaning stones a pale figure in a black hooded cloak sits at a small table, a chess set laid out before him, the far chair empty. He does not look up, but the board is already set as if he expected you. (Sit, or speak — see what he wants.)"
    body_variants:
      - when: {all: [{gate_passed: sandby-dodblek}]}
        body: "The church door stands open on cold air. The pale figure still sits among the leaning stones, the chess set laid between you — but he has already told you what he remembers of the night the school burned, the child who came to him out of the smoke. He inclines his head a fraction, and waits, in no hurry at all."
    edges:
      - id: e-church-street
        to: sandby-street
        label: Leave the churchyard
        effects: {log: "You left the church behind you."}
        sort_order: 9

  # --- Norman Båts: the gravel-pit motel ---
  - id: sandby-quarry
    pos: {x: 3673, y: 371}
    map: {x: 0.4595, y: 0.9138, rx: 0.05, ry: 0.045}
    arc: main
    type: gate
    location: sandby-quarry
    title: The Gravel-Pit Lake
    gate: sandby-norman
    media: {image_theme: quarry-lake-night, music_theme: low-dread}
    body: "Black water fills the old gravel pit, flat and patient. A motel crouches at its edge, half its windows dark, a VACANCY sign buzzing pink. A boyish man in a damp cardigan fumbles a ring of keys behind the desk and smiles too quickly when he sees you. \"Just the one night?\" (Talk to him — but mind the lake, and his mother.)"
    body_variants:
      - when: {all: [{gate_passed: sandby-norman}, {name_known: norman_bats}]}
        body: "Black water fills the old gravel pit, flat and patient, the VACANCY sign still buzzing pink. Norman fusses behind the desk but won't meet your eye now — not since he let slip what the lake keeps, and what Mother doesn't like him saying. He keeps glancing at the dark water, and at the office door."
      - when: {all: [{gate_passed: sandby-norman}]}
        body: "Black water fills the old gravel pit, flat and patient, the VACANCY sign still buzzing pink. The motelkeeper fusses behind the desk but won't meet your eye now — not since he let slip what the lake keeps, and what Mother doesn't like him saying. He keeps glancing at the dark water, and at the office door."
    edges:
      - id: e-quarry-street
        to: sandby-street
        label: Get back on the road to the village
        effects: {log: "You left the lake behind you."}
        sort_order: 9

  # --- Pippa Långskugga: the crooked house ---
  - id: sandby-crooked-house
    pos: {x: 2756, y: 33}
    map: {x: 0.8612, y: 0.3993, rx: 0.05, ry: 0.045}
    arc: main
    type: gate
    location: sandby-crooked-house
    title: The Crooked House
    gate: sandby-pippa
    media: {image_theme: crooked-house-night, music_theme: music-box-broken}
    body: "The house leans as if listening. A grown woman with grey-rooted red braids sits on the porch rail, swinging her boots, a horseshoe bent straight in her hands like soft bread. \"You're new,\" she says, far too cheerful for the hour, \"nobody comes all the way out to where the lamps stop.\" (She knows the village's old secrets — if you can keep up with her.)"
    body_variants:
      - when: {all: [{gate_passed: sandby-pippa}, {name_known: pippa_langskugga}]}
        body: "The house leans as if listening. Pippa still swings her boots on the porch rail, the bent horseshoe in her lap — but the play has gone quiet in her. She has told you what she saw carried out of the burning school, small as a child, and the telling sits oddly on her too-bright face."
      - when: {all: [{gate_passed: sandby-pippa}]}
        body: "The house leans as if listening. The red-braided woman still swings her boots on the porch rail, the bent horseshoe in her lap — but the play has gone quiet in her. She has told you what she saw carried out of the burning school, small as a child, and the telling sits oddly on her too-bright face."
    edges:
      - id: e-crooked-street
        to: sandby-street
        label: Back toward the lit streets
        effects: {log: "You walked back to where the lamps still worked."}
        sort_order: 9

  # --- puzzle: the riddle cut over the lych-gate (church-bell-riddle) ---
  - id: sandby-church-bell
    pos: {x: 2391, y: 254}
    arc: main
    type: puzzle
    location: sandby-church
    title: The Lych-Gate Riddle
    puzzle: church-bell-riddle
    media: {image_theme: church-graveyard-night, music_theme: funeral-cold}
    body: "Words are cut into the lintel over the lych-gate, worn shallow by a century of weather. The tower bell hangs silent above the churchyard, waiting. (Answer what is carved.)"
    body_variants:
      - when: {all: [{puzzle_solved: church-bell-riddle}]}
        body: "The words cut over the lych-gate read plainly now that you have answered them. High in the tower the bell hangs still — but you have heard it give its one soft, untouched note, and the whole churchyard feels, somehow, listened-to."
    edges:
      - id: e-bell-solved
        to: sandby-church
        label: Speak the answer up at the tower
        conditions: {all: [{puzzle_solved: church-bell-riddle}]}
        effects: {progress_points: 15, log: "You spoke the answer; far above, the bell gave one soft, untouched note."}
      - id: e-bell-back
        to: sandby-church
        label: Step back from the gate
        effects: {log: "You left the carved riddle to the weather."}
        sort_order: 8

  # --- puzzle: Dödblek's wager (dodblek-games), offered once you've met him ---
  - id: sandby-dodblek-count
    pos: {x: 2349, y: 497}
    arc: main
    type: puzzle
    location: sandby-church
    title: Dödblek's Wager
    puzzle: dodblek-games
    media: {image_theme: church-graveyard-night, music_theme: funeral-cold}
    body: "Dödblek gestures at the board between you without looking up. \"A small wager before we play,\" he says. \"Count my games honestly, and I will spot you a piece.\" (Give him the number.)"
    body_variants:
      - when: {all: [{puzzle_solved: dodblek-games}]}
        body: "\"Forty-six. Just so,\" Dödblek says, inclining his head a fraction. He lifts a white knight from the board and sets it aside for you — the wager won, the game proper still waiting whenever you are."
    edges:
      - id: e-count-solved
        to: sandby-church
        label: Take the knight Dödblek set aside
        conditions: {all: [{puzzle_solved: dodblek-games}]}
        effects: {progress_points: 15, log: "You counted true; Dödblek lifted a white knight from the board and set it aside for you."}
      - id: e-count-back
        to: sandby-church
        label: Decline the wager
        effects: {log: "You let the wager lie."}
        sort_order: 7

  # --- puzzle: Pippa's riddle-game (shadow-riddle), offered once you've met her ---
  - id: sandby-pippa-shadow
    pos: {x: 2953, y: 7}
    arc: main
    type: puzzle
    location: sandby-crooked-house
    title: Pippa's Riddle-Game
    puzzle: shadow-riddle
    media: {image_theme: crooked-house-night, music_theme: music-box-broken}
    body: "Pippa hops down off the rail and plants herself in your path, delighted. \"Riddle-game, riddle-game!\" she sings. \"Half of my name is the answer — get it, and I'll tell you a secret.\" (Answer her riddle.)"
    body_variants:
      - when: {all: [{puzzle_solved: shadow-riddle}]}
        body: "\"SHADOW!\" Pippa shrieks, clapping, delighted. \"You got it, you got it!\" The riddle-game is won. She swings back up onto the porch rail, kicking her boots, ready to make good on the secret she promised."
    edges:
      - id: e-shadow-solved
        to: sandby-crooked-house
        label: Lean in for the secret Pippa promised
        conditions: {all: [{puzzle_solved: shadow-riddle}]}
        effects: {progress_points: 15, log: "Pippa leaned in close, the play gone right out of her: \"That little one the tall man carried out of the fire — I saw its face in the firelight. It had your face. Younger. But yours.\" Then she was up on the rail again, swinging her boots and humming, as though she'd said nothing at all."}
      - id: e-shadow-back
        to: sandby-crooked-house
        label: Step out of her game
        effects: {log: "You stepped out of Pippa's game."}
        sort_order: 8

# Standalone edges off the village hub (sandby-street, world.yaml).
edges:
  - id: e-street-church
    from: sandby-street
    to: sandby-church
    label: Climb the hill to the old church
    effects: {progress_points: 5, log: "You climbed to Sandby church."}
    sort_order: 2
  - id: e-street-quarry
    from: sandby-street
    to: sandby-quarry
    label: Follow the east road to the gravel-pit lake
    effects: {progress_points: 5, log: "You found the gravel-pit lake and its motel."}
    sort_order: 3
  - id: e-street-crooked
    from: sandby-street
    to: sandby-crooked-house
    label: Walk out to where the streetlamps end
    effects: {progress_points: 5, log: "You reached the crooked house at the village edge."}
    sort_order: 4
  - id: e-church-bell
    from: sandby-church
    to: sandby-church-bell
    label: Read the words cut over the lych-gate
    effects: {progress_points: 5, log: "You found a riddle carved over the lych-gate."}
    sort_order: 3
  - id: e-church-count
    from: sandby-church
    to: sandby-dodblek-count
    label: Take up Dödblek's wager
    conditions: {all: [{flag_set: met_dodblek}]}
    effects: {progress_points: 5, log: "Dödblek set you a wager of arithmetic."}
    sort_order: 4
  - id: e-crooked-shadow
    from: sandby-crooked-house
    to: sandby-pippa-shadow
    label: Play Pippa's riddle-game
    conditions: {all: [{flag_set: met_pippa}]}
    effects: {progress_points: 5, log: "Pippa challenged you to a riddle."}
    sort_order: 5
  # --- random lateral shortcut: the dark edge of the village, quarry ↔ crooked house ---
  - id: e-quarry-crooked
    from: sandby-quarry
    to: sandby-crooked-house
    label: Take the unlit track on toward the crooked house
    effects: {log: "You followed the dark track from the lake to the crooked house."}
    sort_order: 8
  - id: e-crooked-quarry
    from: sandby-crooked-house
    to: sandby-quarry
    label: Follow the dark road back toward the gravel-pit lake
    effects: {log: "You walked back from the crooked house to the lake."}
    sort_order: 8
  # --- real-world shortcut: a village footpath links the church hill and the edge ---
  - id: e-church-crooked
    from: sandby-church
    to: sandby-crooked-house
    label: Take the footpath out to the crooked house at the village edge
    effects: {log: "You took the footpath from the church to the crooked house."}
    sort_order: 8
  - id: e-crooked-church
    from: sandby-crooked-house
    to: sandby-church
    label: Walk back up the hill to the church
    effects: {log: "You walked back up to the church."}
    sort_order: 8

gates:
  - id: sandby-dodblek
    location: sandby-church
    character: herr_dodblek
    intent: Face the pale figure at the chessboard and learn what he remembers of the night the school burned.
    criteria:
      - {id: faced_him, desc: "Player engages rather than flees — sits, plays, or asks him directly who he is or what he wants."}
      - {id: honest, desc: "Player is honest about their fear, or about why they have come, instead of bluffing."}
    success_rule: "faced_him AND honest"
    knowledge_boundary:
      knows:
        - "he was in the churchyard the night Killebäckskolan burned, and a child came to him out of the smoke"
        - "he never hurries, and almost everyone in this region owes him a game eventually"
      refuses:
        - "when, exactly, the player will lose their own game"
        - "the larger mystery of why the stranger is here"
      tone: "calm, courteous, inevitable; explains the rules kindly and never raises his voice"
    hint_ladder:
      - "He moves a pawn and waits, the empty chair turned slightly toward you."
      - "\"Sit. Everyone sits, in the end. I only ask that you be truthful.\""
      - "\"A child came to me here, the night the school burned. I remember the cold of their hand. Ask, and be honest, and I will tell you.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_dodblek
      story_node_next: sandby-church
      log: "Herr Dödblek told you what he saw the night the school burned."
      write_memory: {owner: herr_dodblek, content: "A stranger sat with me in the churchyard and I told them about the child who came out of the smoke the night the school burned.", leakable: true}

  - id: sandby-norman
    location: sandby-quarry
    character: norman_bats
    intent: Get the nervous motelkeeper to talk about the lake and the guests who never checked out.
    criteria:
      - {id: put_at_ease, desc: "Player actively puts him at ease — is warm, gentle, or reassuring, and does not corner or accuse him. A bare greeting, gibberish, or filler does NOT count."}
      - {id: asked_about_lake, desc: "Player asks about the lake, a missing guest, the boathouse, or his mother."}
    success_rule: "put_at_ease AND asked_about_lake"
    knowledge_boundary:
      knows:
        - "some guests check in and the lake keeps them; he tidies their rooms after"
        - "Mother works the desk at night and does not like questions"
      refuses:
        - "what is kept in the boathouse"
        - "the larger mystery of why the stranger is here"
      tone: "shy, stammering, over-friendly; goes cold and flat the instant Mother or the boathouse is named"
    hint_ladder:
      - "He polishes a key that's already clean, laughing softly at nothing."
      - "\"People do love the lake. They stay. They always end up staying.\""
      - "He drops his voice: \"Mother says I shouldn't tell. But the water — the water keeps the ones who stay too long.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 45
      set_flag: met_norman
      story_node_next: sandby-quarry
      log: "Norman let slip what the lake keeps — and that Mother is always watching."
      write_memory: {owner: norman_bats, content: "A kind guest got me talking about the lake and the ones who stay too long. Mother would not have liked it.", leakable: true}

  - id: sandby-pippa
    location: sandby-crooked-house
    character: pippa_langskugga
    intent: Keep up with the strange strong woman until she tells you what she saw at the school.
    criteria:
      - {id: played_along, desc: "Player matches her playfulness or kindness instead of dismissing her as mad or childish."}
      - {id: asked_what_she_saw, desc: "Player asks what she has seen, about the school, the fire, or the man she mentions."}
    success_rule: "played_along AND asked_what_she_saw"
    knowledge_boundary:
      knows:
        - "the night the school burned she saw lights and a tall man carry something small out and away into the dark"
        - "she has lived at the village edge longer than anyone can remember, and no one remembers her parents"
      refuses:
        - "where her parents went"
        - "the larger mystery of why the stranger is here"
      tone: "sing-song nonsense and invented words, then a sudden flat sentence far too sharp for a child; laughs at the wrong moments"
    hint_ladder:
      - "She balances the bent horseshoe on one finger and grins at you to play."
      - "\"I see lots of things out here where the lamps stop. Saw a fire once. Pretty.\""
      - "Flatly, all the play gone: \"A tall man carried something small out of the burning school. Small as a child. Then the lamps came back on and nobody asked.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 45
      set_flag: met_pippa
      story_node_next: sandby-crooked-house
      log: "Pippa, the play gone out of her at last: the night the school burned, she saw a tall man carry something small — small as a child — out of the smoke and away into the dark, and then the lamps came back on and nobody asked."
      write_memory: {owner: pippa_langskugga, content: "A stranger played along with me and I told them about the tall man who carried something small out of the burning school.", leakable: true}
