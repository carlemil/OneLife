# AI dialogue gates. A gate node references one by id. The Actor plays the character; a
# separate Referee judges the criteria; only code applies on_success. `mercy_after_attempts`
# keeps a nine-year-old from getting stuck. Hint ladders are Oliver whispering.
gates:

  # --- Dan: give him a riddle so he forgets the keys (Scen 3) ---
  - id: dan-gatan
    location: personalrummet
    character: dan
    intent: Få Dan att resa sig och gå till whiteboarden genom att ge honom en gåta eller ett matteproblem – så att nyckelknippan ligger kvar obevakad på bordet.
    criteria:
      - {id: riddle, desc: "The player poses Dan an actual maths riddle, puzzle or brain-teaser to solve — e.g. the poster's riddle ('tredubblar du mig och drar bort 9 får du 36'), a variation of it, or any other concrete number puzzle. Asking for the keys, chatting, pleading, or merely saying 'I have a riddle' without giving one does NOT count."}
    success_rule: "riddle"
    knowledge_boundary:
      knows:
        - "att nyckelknippan ligger bredvid datorn på hans skrivbord"
        - "att klassrum 3 är låst för dagen"
        - "veckans klurighet på affischen i korridoren (svaret är 7, men han låtsas inte om att den är lätt)"
      refuses:
        - "att låna ut eller ge bort nycklar till barn"
        - "att lämna skrivbordet för något annat än en riktigt bra gåta"
      tone: "torr, vänlig, distraherad; tänds som en lampa av siffror"
    hint_ladder:
      - "Dan svarar utan att vända sig om: \"Nycklar? Nej. Gå och lek.\" Oliver viskar: \"Fråga inte om nycklarna. Ge honom något att räkna på.\""
      - "Oliver viskar: \"Affischen i korridoren. Veckans klurighet. Läs den för honom – eller hitta på en svårare.\""
      - "Oliver viskar hela gåtan i ditt öra: \"Säg så här: om man tredubblar ett tal och drar bort nio blir det trettiosex – men vad blir det om man i stället gångrar talet med fyra och lägger till sju?\""
    mercy_after_attempts: 4
    on_success:
      progress_points: 40
      set_flag: dan_at_board
      advance_story_time: 2
      announce: "Tystnad. Dans stol skrapar. Han reser sig, tar en whiteboardpenna och börjar skriva: \"Låt x vara talet…\" Han har glömt att ni finns. Nyckelknippan ligger kvar bredvid datorn. Oliver viskar: \"Sexton. Det är sexton.\" Arthur viskar: \"Säg inte det till honom.\""
      log: "Ni gav Dan en gåta. Han står vid whiteboarden nu – nycklarna ligger kvar på bordet."
      write_memory: {owner: dan, content: "Två barn från trean, Arthur och Oliver, gav mig en riktigt bra gåta. Jag stod vid tavlan länge.", leakable: true}

  # --- Sigrid: gum for cover at Lena's 16:40 count (Scen 5) ---
  - id: sigrid-tuggummi
    location: fritidsrummet
    character: sigrid
    intent: Få Sigrid att täcka för er vid Lenas nästa räkning – genom att bjuda på tuggummi och vara schysst, inte genom att ljuga.
    criteria:
      - {id: offers_gum, desc: "The player offers or gives Sigrid the chewing gum (tuggummi), or clearly asks her to cover for them / tell Lena they're on the toilet, and offers her something for it."}
      - {id: kind, desc: "The player is friendly, honest or straight with Sigrid — not lying to her about where they're going, not bossing her around, not being mean. A bare 'hej' or filler does NOT count."}
    success_rule: "offers_gum AND kind"
    knowledge_boundary:
      knows:
        - "att Lena räknar barnen var tjugonde minut – 16:20, 16:40, 17:00"
        - "att Arthur har tuggummi i fickan (det luktar jordgubb)"
        - "att pojkarna tänker smita – hon ser väskorna"
      refuses:
        - "att täcka för någon som ljuger för henne eller är taskig"
        - "att följa med (hon vill, men hon vill ha tuggummit mer)"
      tone: "kaxig, snabb, nyfiken; blir varm om man är rak"
    hint_ladder:
      - "Sigrid tittar på väskorna. \"Vart ska ni?\" Oliver viskar: \"Ljug inte för henne. Hon märker allt.\""
      - "Oliver viskar: \"Hon vill ha något. Du har tuggummi i fickan.\""
      - "Oliver viskar: \"Säg: vill du ha tuggummi om du säger till Lena att vi är på toa?\""
    mercy_after_attempts: 4
    on_success:
      progress_points: 30
      set_flag: sigrid_covers
      clear_flag: have_gum
      advance_story_time: 1
      announce: "Sigrid sträcker ut handen och tar tuggummit. \"Ni är på toa i tjugo minuter. Sen är ni inte min sak.\" Hon lutar sig tillbaka i soffan som om ingenting hänt. (Lenas räkning 16:40 är fixad.)"
      log: "Sigrid tog tuggummit och lovade att täcka för er vid Lenas räkning."
      write_memory: {owner: sigrid, content: "Arthur och Oliver smet med väskorna. Jag fick tuggummi för att säga att de var på toa.", leakable: true}

  # --- Margit: greet her properly or she calls mum (Scen 7) ---
  - id: margit-halsa
    location: villakvarteren
    character: margit
    intent: Få Margit att inte ringa mamma – genom att hälsa ordentligt och ge en lugn, trovärdig förklaring till varför ni är ute.
    criteria:
      - {id: greets, desc: "The player greets Margit politely — says hej/hello to her, by name or as a neighbour, in a friendly way."}
      - {id: reason, desc: "The player gives a calm, believable reason for being out without an adult — e.g. Oliver is sleeping over and they're walking to his house, or a parent knows. Saying they're on a treasure hunt, admitting they sneaked out, or giving no reason does NOT count."}
    success_rule: "greets AND reason"
    knowledge_boundary:
      knows:
        - "att hon känner Arthurs mamma och har hennes nummer"
        - "att skolbarn brukar vara på fritids vid den här tiden"
      refuses:
        - "att låtsas som att hon inte känner igen Arthur"
        - "att låta två små pojkar bara gå förbi utan en förklaring"
      tone: "varm, omständlig, lite misstänksam; pratar om blommor och väder"
    hint_ladder:
      - "Margit ställer ner vattenkannan. \"Arthur? Är det du?\" Oliver viskar: \"Hälsa. Ordentligt.\""
      - "Oliver viskar: \"Säg att jag ska sova över hos dig. Det låter vanligt.\""
      - "Oliver viskar: \"Säg: Hej Margit! Oliver ska sova över, vi är på väg hem till honom.\""
    mercy_after_attempts: 4
    on_success:
      progress_points: 25
      set_flag: margit_ok
      advance_story_time: 1
      announce: "Margit nickar långsamt. \"Ja ja. Hälsa mamma då.\" Hon böjer sig ner över rabatten igen. Hon kommer inte att ringa."
      log: "Ni hälsade på Margit och förklarade er. Hon ringer inte mamma."
      write_memory: {owner: margit, content: "Arthur och hans kompis Oliver gick förbi – Oliver skulle sova över, sa de. Artiga pojkar.", leakable: true}
