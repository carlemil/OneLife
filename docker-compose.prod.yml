# Production overlay — expose OneLife to the internet behind Caddy (HTTPS).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires DOMAIN (and the hardening secrets) set in .env. See PLAN / README.
# The base file already binds db/api/web to 127.0.0.1, so the only port reaching the
# network is Caddy's 8082. The router forwards 80/443 to the Mac mini, which terminates
# TLS for ${DOMAIN} and proxies here; forward nothing to this host.
services:
  api:
    environment:
      # Production posture: no auto-docs (/docs, /redoc, /openapi.json return 404),
      # and the app refuses to boot on the repo's dev ONELIFE_SECRET_KEY. See
      # security.IS_PROD for everything this switches.
      ONELIFE_ENV: prod
      # Same-origin in production: the browser calls https://DOMAIN/api/... so the
      # only allowed CORS origin is the domain. Spotify's redirect must be HTTPS and
      # match the browser origin exactly.
      WEB_ORIGIN: https://${DOMAIN}
      SPOTIFY_REDIRECT_URI: https://${DOMAIN}/
      # Caddy is the only thing that reaches the api container from the network, so
      # its X-Forwarded-For is the one we trust to key rate limits per client. This
      # is Docker's default address pool, where the compose bridge lives. Leave it
      # unset anywhere Caddy isn't in front: then XFF is ignored and cannot be spoofed.
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12

  web:
    environment:
      # Empty -> the built app uses relative /api requests (resolved by Caddy to the
      # api service). vite reads this at build time, so it must be set for the build.
      VITE_API_BASE: ""
    # Build the static bundle, then serve it (no dev server / HMR in production).
    command: sh -c "npm run build && npm run preview"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      # A port-only address -> plain HTTP, no ACME. TLS for ${DOMAIN} is terminated by
      # the Caddy on the Mac mini (192.168.1.191), which owns the router's 80/443 and
      # reverse-proxies this host on 8082. See Caddyfile's trusted_proxies block.
      SITE_ADDRESS: ":8082"
    ports:
      - "8082:8082"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists issued certificates across restarts
      - caddy_config:/config

  # Keeps the DuckDNS record pointed at this host's current public IP (for dynamic
  # home IPs). Only needed when DOMAIN is a *.duckdns.org name. SUBDOMAINS is just
  # the label(s) without ".duckdns.org" (e.g. "erbserver"); TOKEN is from duckdns.org.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
    volumes:
      - duckdns_config:/config

volumes:
  caddy_data:
  caddy_config:
  duckdns_config:
