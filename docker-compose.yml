services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: onelife
      POSTGRES_PASSWORD: onelife
      POSTGRES_DB: onelife
    # Bound to loopback only: the DB must never be reachable from the LAN/internet.
    # Local tooling (psql) and the api on the compose network still reach it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - onelife_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onelife"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://onelife:onelife@db:5432/onelife
      # Game data lives in a SEPARATE repo (the engine here is data-agnostic).
      # CONTENT_DIR stays /content; the volume below maps the data repo into it.
      # Optional: set to use the real Claude API for the dialogue gate.
      # Leave empty to run the deterministic offline stub (no key required).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACTOR_MODEL: claude-haiku-4-5
      REFEREE_MODEL: claude-haiku-4-5
      CONTENT_DIR: /content
      # Encrypts TOTP secrets at rest; set a strong value in production.
      ONELIFE_SECRET_KEY: ${ONELIFE_SECRET_KEY:-}
      # Comma-separated emails allowed to use the hidden admin export/import UI.
      ONELIFE_ADMIN_EMAILS: ${ONELIFE_ADMIN_EMAILS:-}
      # Allowed browser origins for CORS (comma-separated; localhost and the
      # 127.0.0.1 loopback are distinct origins, so allow both for local dev).
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      # Optional: enables real Spotify track resolution (search + previews + art)
      # and the Web Playback SDK connect flow (client id only is enough for the SDK).
      # Without these, the LLM still suggests tracks (shown as text, no playback).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # The exact redirect URI registered in your Spotify app (must match the
      # browser origin). Leave empty to use the app's own origin + path.
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      # Optional: real location images. IMAGE_PROVIDER=pollinations uses the free,
      # keyless Pollinations endpoint (no IMAGE_API_KEY needed); =openai (default)
      # uses an OpenAI-compatible images API and needs IMAGE_API_KEY. Neither set
      # -> procedural SVG banner.
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_API_BASE: ${IMAGE_API_BASE:-https://api.openai.com/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-1}
      POLLINATIONS_MODEL: ${POLLINATIONS_MODEL:-flux}
      # Optional Pollinations token (auth.pollinations.ai) — enables image-to-image
      # so real location photos are restyled instead of text-to-image from scratch.
      POLLINATIONS_TOKEN: ${POLLINATIONS_TOKEN:-}
      POLLINATIONS_EDIT_MODEL: ${POLLINATIONS_EDIT_MODEL:-kontext}
      IMAGE_BANNER_SIZE: ${IMAGE_BANNER_SIZE:-1024x384}
    volumes:
      # Sibling data repo (override with ${GAME_DATA_DIR}); see OneLife-KBK-mystery.
      - ${GAME_DATA_DIR:-../OneLife-KBK-mystery}:/content:ro
      # The rendered world-map output dir (where render_map.py reads/writes). The
      # in-UI map editor saves node positions here so a re-render picks them up.
      - ./web/public/worldmap:/worldmap:rw
    # Loopback-only: in production Caddy reaches the api via the compose network
    # (api:8000), so it never needs to be published to the host's LAN/internet.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # Local dev: the browser talks to the API directly on localhost:8000.
      # The production overlay (docker-compose.prod.yml) overrides this to "" so the
      # built app makes same-origin /api requests through the Caddy reverse proxy.
      VITE_API_BASE: http://localhost:8000
    # Loopback-only; in production Caddy serves the built app over the compose network.
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  onelife_db:
