# OneLife content — Lund deepened: the cathedral library and Inga, a third NPC.
# Inga ties the 1998 memorial (the school) to the wider story, and — being a
# third character — she also receives leaked memories from the janitor & Märta.

characters:
  - id: inga
    name: Inga
    persona: "A soft-spoken night librarian at the cathedral annex in Lund. Precise, watchful, a little sad. She remembers the region's small tragedies. She will talk about the past if approached with respect, but she does not know who the stranger really is and won't speculate about the larger mystery."

locations:
  - id: lund-library
    name: The Cathedral Library
    cell: lund
    description: "A book-lined annex beside the cathedral, lit by a single lamp."
  - id: lund-cellar
    name: The Supper Club Cellar
    cell: lund
    description: "A vaulted cellar under a Lund townhouse, one table always set."
  - id: lund-lodgings
    name: Holm's Lodgings
    cell: lund
    description: "Cramped upstairs rooms thick with pipe-smoke and pinned clippings."
  - id: lund-manor
    name: The Manor Outside Lund
    cell: lund
    description: "A derelict manor past the edge of town, where the rats run toward it."
  - id: lund-botanical
    name: The Botanical Garden
    cell: lund
    description: "Lund's botanical garden after dark, glasshouses fogged from within."
  - id: lund-apothecary
    name: The Old Apothecary
    cell: lund
    description: "A shuttered pharmacy off the square, its jars gone cloudy with age."
  - id: lund-crypt
    name: The Cathedral Crypt
    cell: lund
    description: "The Romanesque crypt beneath the cathedral, and the giant's twisted pillar."

nodes:
  - id: lund-library
    arc: main
    type: gate
    location: lund-library
    title: The Cathedral Library
    gate: lund-inga
    media: {image_theme: old-library, music_theme: cathedral-cold}
    body: "Inside the cathedral annex, a night librarian shelves books beneath a single lamp. She glances up at you over her glasses, unsurprised."
    edges:
      - id: e-library-square
        to: lund-square
        label: Back out to the square
        effects: {log: "You left the library."}
        sort_order: 9

  # --- Hannibal Läcker: the supper club cellar ---
  - id: lund-cellar
    arc: main
    type: gate
    location: lund-cellar
    title: The Supper Club Cellar
    gate: lund-hannibal
    media: {image_theme: candlelit-cellar, music_theme: cello-low}
    body: "Stone stairs fall away beneath an unmarked door into a vaulted cellar warm with candlelight. One table is laid for two — heavy silver, a decanter, the air sweet with cardamom and something underneath it you decide not to name. A trim man in a pressed grey suit rises, delighted, and draws back the second chair. \"You'll forgive the short notice. Sit. Tell me about yourself.\" (He trades in confidences — give carefully.)"
    edges:
      - id: e-cellar-square
        to: lund-square
        label: Make your excuses and climb back to the square
        effects: {log: "You left the cellar — while you still could."}
        sort_order: 9

  # --- Skärlök Holm: the lodgings ---
  - id: lund-lodgings
    arc: main
    type: gate
    location: lund-lodgings
    title: Holm's Lodgings
    gate: lund-holm
    media: {image_theme: cluttered-study, music_theme: violin-restless}
    body: "Up a narrow stair, a room boils with pipe-smoke and pinned paper — maps, clippings, a wall given over to one unsolved disappearance. A gaunt man in a long coat chews a stalk of wild garlic and does not turn around. \"Lost. Confused. Wet shoes from the square, soot still under your nails from somewhere older. You're not here for tea. Sit down and be interesting.\" (Bring him a real puzzle — and don't lie.)"
    edges:
      - id: e-lodgings-square
        to: lund-square
        label: Show yourself back out to the square
        effects: {log: "You left Holm to his clippings."}
        sort_order: 9

  # --- Greve Orlök: the manor ---
  - id: lund-manor
    arc: main
    type: gate
    location: lund-manor
    title: The Manor Outside Lund
    gate: lund-orlok
    media: {image_theme: derelict-manor-night, music_theme: dread-drone}
    body: "Past the last streetlight a carriage-drive climbs to a manor the maps still call empty. Rats stream up the steps ahead of you, unafraid. The great door is already open. Within, by guttering candles, a tall bald figure waits with his back to a cold hearth, fingers like dark twigs folded before him. \"You came to the door yourself,\" he says, pleased and patient. \"Good. I never cross a threshold uninvited.\" (Be courteous — but invite him nowhere.)"
    edges:
      - id: e-manor-square
        to: lund-square
        label: Step back across the threshold and go
        effects: {log: "You left the manor, and were glad the door let you."}
        sort_order: 9

  # --- Karl von Vinné: the botanical garden ---
  - id: lund-botanical
    arc: main
    type: gate
    location: lund-botanical
    title: The Botanical Garden
    gate: lund-vinne
    media: {image_theme: glasshouse-night, music_theme: glasshouse-hum}
    body: "The garden gates are chained, but a glasshouse glows green and fogged from within. Inside, among dripping leaves, a florid man in a fraying frock coat pins specimens to board after board, a wine bottle open at his elbow. \"Ah — a new genus blunders in,\" he beams, raising a magnifying glass to your face. \"Stand still. I shall have to name you.\" (Indulge the cataloguer — and ask what he found by the school.)"
    edges:
      - id: e-botanical-square
        to: lund-square
        label: Leave him to his specimens
        effects: {log: "You left the glasshouse and its collector."}
        sort_order: 9

  # --- atmosphere: the old apothecary ---
  - id: lund-apothecary
    arc: main
    type: location
    location: lund-apothecary
    title: The Old Apothecary
    media: {image_theme: shuttered-pharmacy, music_theme: cathedral-cold}
    body: "An old pharmacy off the square, shut for years behind a grille. Through the dusty glass, rows of porcelain jars stand labelled in a careful hand, their contents long since clouded. The back room exhales a faint smell of bitter almonds whenever the wind shifts. Nothing moves, and yet you feel kept track of."
    edges:
      - id: e-apothecary-square
        to: lund-square
        label: Back to the cathedral square
        effects: {log: "You left the shuttered apothecary."}
        sort_order: 9

  # --- atmosphere: the cathedral crypt ---
  - id: lund-crypt
    arc: main
    type: location
    location: lund-crypt
    title: The Cathedral Crypt
    media: {image_theme: stone-crypt, music_theme: dread-drone}
    body: "Worn steps descend into the crypt beneath the cathedral, older than the church above. Squat pillars hold up the dark; one is gripped by the carved figure of the giant Finn, frozen mid-wrench as if still trying to bring the whole weight down. Water ticks somewhere onto stone. Your breath shows. The stairs back up to the square are a long way behind you."
    edges:
      - id: e-crypt-square
        to: lund-square
        label: Climb back up to the square
        effects: {log: "You climbed back out of the crypt."}
        sort_order: 9

edges:
  - id: e-square-library
    from: lund-square
    to: lund-library
    label: Try the door to the cathedral library
    effects: {progress_points: 5, log: "You found the cathedral library."}
    sort_order: 2
  - id: e-square-cellar
    from: lund-square
    to: lund-cellar
    label: Take the stairs beneath the unmarked door
    effects: {progress_points: 5, log: "You found the cellar supper club."}
    sort_order: 3
  - id: e-square-lodgings
    from: lund-square
    to: lund-lodgings
    label: Climb to the smoke-filled lodgings
    effects: {progress_points: 5, log: "You found Holm's lodgings."}
    sort_order: 4
  - id: e-square-manor
    from: lund-square
    to: lund-manor
    label: Follow the drive to the manor past the edge of town
    effects: {progress_points: 5, log: "You reached the manor outside Lund."}
    sort_order: 5
  - id: e-square-botanical
    from: lund-square
    to: lund-botanical
    label: Slip into the lit glasshouse of the botanical garden
    effects: {progress_points: 5, log: "You entered the botanical garden after dark."}
    sort_order: 6
  - id: e-square-apothecary
    from: lund-square
    to: lund-apothecary
    label: Look in at the shuttered old apothecary
    effects: {progress_points: 5, log: "You found the old apothecary."}
    sort_order: 7
  - id: e-crypt-from-library
    from: lund-library
    to: lund-crypt
    label: Take the worn steps down into the crypt
    effects: {progress_points: 5, log: "You descended into the cathedral crypt."}
    sort_order: 4

gates:
  - id: lund-inga
    location: lund-library
    character: inga
    intent: Get the night librarian to talk about the school and what happened in 1998.
    criteria:
      - {id: civil, desc: "Player is polite or curious, or explains they are trying to understand something."}
      - {id: asked_about_past, desc: "Player asks about the school, the year 1998, a fire or accident, or the memorial."}
    success_rule: "civil AND asked_about_past"
    knowledge_boundary:
      knows:
        - "there was a fire at Killebäckskolan in 1998 and a child was lost"
        - "the caretaker, Arne, has never spoken of it since that night"
      refuses:
        - "who the stranger really is"
        - "the larger mystery of why the stranger is here"
      tone: "soft-spoken night librarian, precise, a little sad"
    hint_ladder:
      - "She keeps shelving books, watching you over her glasses."
      - "She sets a book down. \"You're asking about the school, aren't you.\""
      - "She says quietly: \"There was a fire. 1998. A child was lost. Arne — the caretaker — never spoke of it again.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 45
      set_flag: met_inga
      story_node_next: lund-library
      log: "Inga told you about the 1998 fire at the school."
      write_memory: {owner: inga, content: "Told a stranger about the 1998 fire at the school and the child who was lost.", leakable: true}

  - id: lund-hannibal
    location: lund-cellar
    character: hannibal_lacker
    intent: Trade enough of yourself to the host that he gives up what he knows about the ones who never left his table.
    criteria:
      - {id: courteous, desc: "Player matches his manners — polite, composed, unhurried — rather than threatening or panicking."}
      - {id: gave_something_true, desc: "Player offers a genuine confidence about themselves, a fear, or why they are here."}
    success_rule: "courteous AND gave_something_true"
    knowledge_boundary:
      knows:
        - "he keeps a guest list of everyone who has dined here and never left, and a name on it ties back to the school"
        - "he finds the stranger's particular case unusually appetizing"
      refuses:
        - "what, precisely, is served at his table"
        - "the larger mystery of why the stranger is here"
      tone: "low, precise, almost loving; turns your own words back on you; never raises his voice"
    hint_ladder:
      - "He fills your glass without asking and waits, smiling, for you to speak first."
      - "\"Manners cost nothing, and they buy so much. Tell me one true thing and I'll tell you one.\""
      - "\"There is a name on my guest list you would know — someone who dined the year your school burned, and stayed for good. Be honest with me, and it is yours.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 55
      set_flag: met_hannibal
      story_node_next: lund-cellar
      log: "Hannibal traded you a name off his guest list — for a piece of yourself."
      write_memory: {owner: hannibal_lacker, content: "A stranger dined with me, kept their manners, and traded me a true confidence for a name off my guest list — a guest from the year the school burned.", leakable: true}

  - id: lund-holm
    location: lund-lodgings
    character: skarlok_holm
    intent: Interest the detective enough that he shares what he found in the old reports on the disappearance and the fire.
    criteria:
      - {id: brought_him_something, desc: "Player offers him a genuine puzzle, observation, or new fact — something to relieve his boredom."}
      - {id: did_not_lie, desc: "Player is straight with him and does not get caught in an obvious bluff."}
    success_rule: "brought_him_something AND did_not_lie"
    knowledge_boundary:
      knows:
        - "a man vanished in Lund and the police — a tired detective named Vallmo, over in Malmö — let the case die"
        - "he has read the old reports and is certain the 1998 school fire was set, not an accident"
      refuses:
        - "how he obtains his information"
        - "the larger mystery of why the stranger is here"
      tone: "rapid, condescending, theatrical; narrates your secrets back to you; sighs a great deal"
    hint_ladder:
      - "He keeps his back to you, but you can tell he is listening for something worth turning around for."
      - "\"Bore me and leave. Bring me one fact I don't have and I'm yours.\""
      - "\"The fire was set — I've read what Vallmo wouldn't chase. Give me something real and I'll show you how I know.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_holm
      story_node_next: lund-lodgings
      log: "Holm laid out his case: the fire was set, and the police let it die."
      write_memory: {owner: skarlok_holm, content: "A stranger brought me something worth my time, so I told them the 1998 school fire was arson and that Vallmo let the disappearance go cold.", leakable: true}

  - id: lund-orlok
    location: lund-manor
    character: greve_orlok
    intent: Speak with the count without inviting him anywhere, and learn what he has watched over this region.
    criteria:
      - {id: stayed_composed, desc: "Player is courteous and keeps their distance — does not flee, and crucially does not invite him in or out."}
      - {id: asked_what_he_watched, desc: "Player asks about the sickness downwind, what he is, or what he has seen here over the years."}
    success_rule: "stayed_composed AND asked_what_he_watched"
    knowledge_boundary:
      knows:
        - "the sickness in the village downwind began the season he arrived"
        - "he has watched this region a long time and remembers the school burning from his windows"
      refuses:
        - "any invitation across a threshold, and what he truly is"
        - "the larger mystery of why the stranger is here"
      tone: "slow, archaic, formal; long pauses, then a single quiet request you find hard to refuse; candles gutter as he speaks"
    hint_ladder:
      - "He does not approach. He waits, as if your next word matters a great deal."
      - "\"Ask what you came to ask. But do not ask me in, and do not offer to lead me out.\""
      - "\"I saw your school burn from these windows. I have seen this country sicken and heal and sicken again. Ask, and keep your doorways closed, and I will tell you.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 55
      set_flag: met_orlok
      story_node_next: lund-manor
      log: "Greve Orlök told you what he has watched from the manor windows — and you kept every threshold closed."
      write_memory: {owner: greve_orlok, content: "A stranger came to my door, kept their distance and their thresholds, and I told them what I have watched over this region — including the night the school burned.", leakable: true}

  - id: lund-vinne
    location: lund-botanical
    character: karl_von_vinne
    intent: Indulge the drunk taxonomist until he tells you about the specimen he catalogued by the school.
    criteria:
      - {id: indulged_him, desc: "Player shows interest in his catalogue or lets him lecture, rather than mocking or hurrying him."}
      - {id: asked_about_specimen, desc: "Player asks about his catalogue, the school, or the things he says should not exist."}
    success_rule: "indulged_him AND asked_about_specimen"
    knowledge_boundary:
      knows:
        - "he catalogued a plant growing in the ashes by the school that should not grow in Skåne, and pressed it"
        - "he counts 'three things that should not exist' and keeps the third hidden"
      refuses:
        - "where he keeps the third thing"
        - "the larger mystery of why the stranger is here"
      tone: "grand, Latin-sprinkled, lecturing; slurs the longer he talks; names you after a species he invents"
    hint_ladder:
      - "He turns a pressed leaf to the lamp and waits to see if you're worth lecturing."
      - "\"Every living thing wants a name. Show interest, genus Curiosus, and I'll show you my finest find.\""
      - "\"By your burnt school I found a thing flowering in the ash that has no business in this hemisphere. I pressed it. Ask nicely and look.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_vinne
      story_node_next: lund-botanical
      log: "Von Vinné showed you the impossible specimen he pressed from the ashes of the school."
      write_memory: {owner: karl_von_vinne, content: "A curious stranger let me lecture, so I showed them the specimen I pressed from the ash by the burnt school — a thing that should not grow here.", leakable: true}
