# OneLife content — a library of 10 standalone puzzles in the game's authoring
# format (STORY_AND_PUZZLES.md §5). Each is fully solvable in code: solution.kind
# is `exact` (case-insensitive match) or `set` (any member accepted). They carry a
# 3-rung hint_ladder (escalating to a near-giveaway) and on_solve effects.
#
# These are inert until wired into a `puzzle` node (node.type: puzzle, puzzle: <id>);
# kept here as a reusable set, themed to the dark Skåne world and its NPCs. No
# required_clues, so they need no woven clues to be solvable.

puzzles:
  # 1 — riddle (the Sandby church bell / Herr Dödblek's churchyard)
  - id: church-bell-riddle
    type: riddle
    prompt: "Carved over the lych-gate at Sandby church: \"Iron-tongued, bronze-throated, I keep no voice of my own, yet all of Sandby hears me name the dead. What am I?\""
    solution: {kind: set, set: [bell, the bell, a bell, church bell, klocka, kyrkklocka]}
    hint_ladder:
      - "You have heard it from the hill, on the wind, at every funeral."
      - "It hangs in the tower and swings to speak; it has a tongue but no throat of flesh."
      - "It is the church bell. Answer: bell."
    on_solve:
      progress_points: 25
      set_flag: solved_church_bell
      log: "The lych-gate riddle answers itself: the bell. Something in the tower settles."

  # 2 — riddle (fog off the Öresund / Malmö)
  - id: fog-riddle
    type: riddle
    prompt: "A line scratched on the harbour wall: \"I come off the Öresund with no feet, swallow Malmö whole without teeth, and leave only when the sun asks twice. What am I?\""
    solution: {kind: set, set: [fog, the fog, mist, the mist, dimma, dimman, haze]}
    hint_ladder:
      - "It comes in grey off the water and the cranes vanish into it."
      - "You walk through it and it parts; it has no body, only weather."
      - "It is the fog. Answer: fog (dimma)."
    on_solve:
      progress_points: 25
      set_flag: solved_fog
      log: "Fog. The word feels right, and the harbour seems to breathe out."

  # 3 — riddle (Pippa Långskugga — 'long shadow')
  - id: shadow-riddle
    type: riddle
    prompt: "Pippa grins and points at her own name. \"Half of what I'm called, you carry too. I'm longest where the lamps give out, and I'm gone the very moment you bring a light to find me. What am I?\""
    solution: {kind: set, set: [shadow, a shadow, my shadow, your shadow, skugga, skuggan, long shadow]}
    hint_ladder:
      - "Långskugga. The second half of her name is the answer."
      - "It stretches at dusk and dies under a lamp; you cannot hold it."
      - "It is a shadow. Answer: shadow (skugga)."
    on_solve:
      progress_points: 30
      set_flag: solved_shadow
      log: "\"Shadow,\" you say. Pippa laughs, delighted and a little sad."

  # 4 — riddle (Greve Orlök's window candle)
  - id: candle-riddle
    type: riddle
    prompt: "By guttering light the count murmurs: \"I stand at my window and at every wake. The taller I grow the shorter I live; I weep as I work, and I die when you breathe on me. What am I?\""
    solution: {kind: set, set: [candle, a candle, the candle, candle flame, ljus, stearinljus, taper]}
    hint_ladder:
      - "It lights the manor and the funeral both."
      - "Wax, wick, and a flame that shrinks it as it burns; a breath puts it out."
      - "It is a candle. Answer: candle (ljus)."
    on_solve:
      progress_points: 30
      set_flag: solved_candle
      log: "\"A candle.\" Orlök inclines his head; the flame steadies."

  # 5 — combination (Herr Dödblek's tally of games)
  - id: dodblek-games
    type: combination
    prompt: "Dödblek has played one game of chess every year since he came to the churchyard, and he has never agreed to a draw. He has played forty-seven games and lost only one. How many has he won?"
    solution: {kind: exact, value: "46"}
    hint_ladder:
      - "No draws — so every game was either a win or a loss."
      - "Forty-seven games, exactly one of them a loss."
      - "47 minus the single loss. Answer: 46."
    on_solve:
      progress_points: 30
      set_flag: solved_dodblek_games
      log: "\"Forty-six,\" you say. Dödblek almost smiles. \"Forty-six. And one I think about still.\""

  # 6 — combination (gravestone arithmetic, Gamla kyrkogården)
  - id: gravestone-sum
    type: combination
    prompt: "Three stones in the old cemetery share a secret: each soul lived the very same span of years. BORN 1901 — DIED 1947. BORN 1886 — DIED 1932. BORN 1922 — DIED ____. Give the missing year."
    solution: {kind: exact, value: "1968"}
    hint_ladder:
      - "1947 − 1901 = 46. Check the second stone: it agrees."
      - "Each lived 46 years. Add that to 1922."
      - "1922 + 46. Answer: 1968."
    on_solve:
      progress_points: 35
      set_flag: solved_gravestone
      log: "You chalk 1968 onto the blank stone. The fog over the plot thins."

  # 7 — combination (Lund station departures board)
  - id: last-train-time
    type: combination
    prompt: "Lund station's last train to Malmö leaves at the only time between 20:00 and 23:00 whose four digits, on the 24-hour board, are all the same. What time is it?"
    solution: {kind: set, set: ["22:22", "2222", "22.22"]}
    hint_ladder:
      - "All four digits identical, and the hour is between 20 and 23."
      - "The hour and minutes must read the same pair: 2_:_2."
      - "Answer: 22:22."
    on_solve:
      progress_points: 30
      set_flag: solved_last_train
      log: "22:22. The departures board flickers as if you'd reminded it of something."

  # 8 — word-lock (a five-letter Skåne town — Vallmo/Wallander's old beat)
  - id: ystad-wordlock
    type: wordlock
    prompt: "A second harbour word-lock, five dials. Vallmo mutters that it spells the coastal town east of here where he worked the case he never closed. Five letters."
    solution: {kind: set, set: [YSTAD, ystad]}
    hint_ladder:
      - "A real town on the south Skåne coast, east of Malmö."
      - "Five letters, begins with Y."
      - "Answer: YSTAD."
    on_solve:
      progress_points: 30
      set_flag: solved_ystad_lock
      log: "Y-S-T-A-D. The lock gives with a cold click."

  # 9 — riddle (Karl von Vinné's specimen — Sambucus nigra)
  - id: elder-specimen
    type: riddle
    prompt: "Von Vinné pins a sprig to the board. \"Sambucus nigra. Name it as the locals do — the tree whose cream flowers I steep for cordial and whose black berries stain my hands. Common name?\""
    solution: {kind: set, set: [elder, elderberry, elder tree, elderflower, fläder, flader, fläderbär, fläderträd]}
    hint_ladder:
      - "Hedgerow tree; cream flower-heads in June, dark berries in autumn."
      - "Its flowers make cordial; the Swedes call it fläder."
      - "Answer: elder (fläder)."
    on_solve:
      progress_points: 30
      set_flag: solved_elder
      log: "\"Elder,\" you offer. \"Fläder.\" He beams and names a new species after you."

  # 10 — anagram (the lost child's chalk letters)
  - id: marta-anagram
    type: anagram
    prompt: "On the classroom floor, a child's chalk has scattered five letters: A · R · T · M · Ä. Rearranged, they spell the name whispered in the dark. What name?"
    solution: {kind: set, set: [märta, marta]}
    hint_ladder:
      - "A girl's name, five letters, two of them sharing a sound."
      - "It begins with M and ends with A: M _ _ _ A."
      - "Answer: MÄRTA."
    on_solve:
      progress_points: 35
      set_flag: solved_marta_anagram
      log: "MÄRTA. The chalk letters seem to settle into place, and somewhere a child stops crying."
