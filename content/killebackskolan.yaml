arcs:
  - id: main
    title: The Killebäck Awakening
    is_spine: true

characters:
  - id: the-janitor
    name: The Janitor
    persona: "A wary old caretaker. Speaks in short, clipped sentences. Suspicious of strangers, but softens if treated with kindness or pity. He has worked here for decades and knows the building's secrets. He does NOT know anything about the world outside Sandby or the larger mystery, and deflects such questions."

locations:
  - id: killebackskolan
    name: Killebäckskolan
    description: "A school in Södra Sandby. It should be empty at this hour."

nodes:
  - id: kbk-wake
    arc: main
    type: narration
    location: killebackskolan
    title: "Déjà Vu"
    entry: true
    media: {image_theme: school-hallway-dusk, music_theme: uneasy-quiet}
    body: "You come to with a jolt. Fluorescent light hums overhead. The smell of floor polish and old paper. You are sitting on the cold tiles of a school you are certain you have stood in before — Killebäckskolan — though you cannot say when, or how you got here tonight. Rain ticks against the high windows. You should not be here."
    edges:
      - id: e-wake-bearings
        to: kbk-entrance-hall
        label: Get your bearings
        effects: {progress_points: 5, log: "You got to your feet in the entrance hall."}

  - id: kbk-entrance-hall
    arc: main
    type: location
    location: killebackskolan
    title: The Entrance Hall
    media: {image_theme: school-hallway-dusk, music_theme: uneasy-quiet}
    body: "The entrance hall stretches before you, lined with dented lockers. A mop bucket sits abandoned beside a heavy door marked PANNRUM. By the lockers, an old janitor works a rag over a brass plaque, pretending not to watch you."
    edges:
      - id: e-hall-janitor
        to: kbk-janitor-gate
        label: Approach the old janitor
        effects: {progress_points: 5, log: "You approached the janitor."}
      - id: e-hall-plaque
        to: kbk-entrance-hall
        label: Examine the brass plaque the janitor is polishing
        conditions: {all: [{not: {flag_set: examined_plaque}}]}
        effects: {progress_points: 10, set_flag: examined_plaque, log: "You read the memorial plaque: \"IN MEMORIAM — 1998\"."}
      - id: e-hall-pannrum
        to: kbk-boiler-room
        label: Open the PANNRUM (boiler room) door
        conditions: {all: [{flag_set: knows_boiler_exit}]}
        effects: {progress_points: 15, log: "You slipped through the boiler-room door."}
      - id: e-hall-force
        to: kbk-caught
        label: Force the PANNRUM door open
        conditions: {all: [{not: {flag_set: knows_boiler_exit}}]}
        effects: {log: "You forced the door."}
        danger: 2

  - id: kbk-janitor-gate
    arc: main
    type: gate
    location: killebackskolan
    title: The Janitor
    gate: kbk-janitor-find-the-exit
    media: {image_theme: school-hallway-dusk, music_theme: uneasy-quiet}
    body: "The old man keeps his eyes on the brass. \"School's closed,\" he mutters. \"You shouldn't be here.\" (Talk to him — try to find out how to get out.)"
    edges:
      - id: e-gate-leave
        to: kbk-entrance-hall
        label: Step back into the hall
        effects: {log: "You stepped back from the janitor."}
        sort_order: 9

  - id: kbk-boiler-room
    arc: main
    type: puzzle
    location: killebackskolan
    title: The Boiler Room
    puzzle: boiler-cabinet-code
    media: {image_theme: boiler-room-dark, music_theme: low-dread}
    body: "The boiler room is hot and close, pipes groaning in the dark. Against the far wall stands a rusted steel cabinet, secured with a 4-digit padlock."
    edges:
      - id: e-boiler-solved
        to: kbk-the-drawing
        label: Look inside the open cabinet
        conditions: {all: [{puzzle_solved: boiler-cabinet-code}]}
        effects: {progress_points: 25, log: "You opened the cabinet."}
      - id: e-boiler-leave
        to: kbk-entrance-hall
        label: Go back to the hall
        effects: {log: "You returned to the hall."}
        sort_order: 9

  - id: kbk-the-drawing
    arc: main
    type: ending
    location: killebackskolan
    title: The Drawing
    media: {image_theme: boiler-room-dark, music_theme: revelation}
    body: "The cabinet swings open. Inside, taped to the back panel, is a child's crayon drawing: a stick figure outside this very school, under a scrawled date. Your hands are shaking, because you recognize the drawing. You drew it. ▒ End of the prototype slice. ▒"

  - id: kbk-caught
    arc: main
    type: death
    location: killebackskolan
    title: In the Dark
    media: {image_theme: boiler-room-dark, music_theme: low-dread}
    body: "You throw your shoulder against the PANNRUM door. It gives with a shriek of metal — into pure black. Something in that dark had been waiting a very long time. It does not hesitate. ▒ You have died. ▒"

gates:
  - id: kbk-janitor-find-the-exit
    location: killebackskolan
    character: the-janitor
    intent: Get the janitor to reveal how to leave the locked school.
    criteria:
      - {id: established_trust, desc: "Player is polite or not hostile, OR mentions they are lost, scared, or confused."}
      - {id: asked_about_exit, desc: "Player asks, directly or indirectly, how to get out, where a door is, or how to leave."}
    success_rule: "established_trust AND asked_about_exit"
    knowledge_boundary:
      knows:
        - "the boiler-room (PANNRUM) door has been broken since 1998 and is the only way out after dark"
        - "the newcomer looks like someone he saw here years ago"
      refuses:
        - "anything about the world outside Sandby"
        - "the larger mystery of why the player is here"
      tone: "wary old man, short sentences, warms up if treated kindly"
    hint_ladder:
      - "He grumbles and keeps polishing, volunteering nothing."
      - "He glances, just for a second, toward the door marked PANNRUM."
      - "He sighs. \"That boiler-room door's been broke since '98. Only way out after dark. Now leave me be.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 40
      set_flag: knows_boiler_exit
      story_node_next: kbk-entrance-hall
      log: "The janitor let slip that the boiler-room door is the way out after dark."
      write_memory: {owner: the-janitor, content: "Told the newcomer about the boiler-room exit.", leakable: true}

puzzles:
  - id: boiler-cabinet-code
    type: combination
    prompt: "The rusted cabinet has a 4-digit padlock."
    solution: {kind: exact, value: "1998"}
    required_clues: [year-1998-graffiti, janitor-said-98, plaque-1998]
    hint_ladder:
      - "The number feels like a year."
      - "The janitor, the graffiti, and the memorial plaque all circle the same year."
      - "Try 1998."
    on_solve: {progress_points: 60, set_flag: opened_boiler_cabinet, log: "The padlock clicks open."}

clues:
  - id: year-1998-graffiti
    puzzle: boiler-cabinet-code
    placement: {kind: location_text, location_id: killebackskolan}
    reveal_text: "Scratched into a locker door: \"DET HÄNDE HÄR '98\" (it happened here '98)."
    discover_conditions: {all: [{node_visited: kbk-entrance-hall}]}
  - id: janitor-said-98
    puzzle: boiler-cabinet-code
    placement: {kind: dialogue, character_id: the-janitor}
    reveal_text: "The janitor said the boiler door has been broken since '98."
    discover_conditions: {all: [{gate_passed: kbk-janitor-find-the-exit}]}
  - id: plaque-1998
    puzzle: boiler-cabinet-code
    placement: {kind: interaction, location_id: killebackskolan}
    reveal_text: "The brass memorial plaque reads: IN MEMORIAM — 1998."
    discover_conditions: {all: [{flag_set: examined_plaque}]}
