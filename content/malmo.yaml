# OneLife content — Malmö, a new city cell west of Lund, with a word-lock puzzle.
# Shows the world growing (fog-of-war reveals it when you reach Lund) and a
# `set`-solution puzzle (several accepted answers) beyond the school.

cells:
  - id: malmo
    grid_x: 1
    grid_y: 3
    name: Malmö
    kind: city
    region: "Malmö, Skåne"
    arrival_node: malmo-harbor

locations:
  - id: malmo-harbor
    name: The Harbour
    cell: malmo
    description: "Malmö's old harbour, cranes black against the Öresund."
  - id: malmo-locker
    name: Harbour Lockers
    cell: malmo
    description: "A row of dented harbour storage lockers, salt-rusted."
  - id: malmo-rosengard
    name: Rosengård
    cell: malmo
    description: "Concrete estates and a floodlit cage pitch on the city's edge."
  - id: malmo-server-basement
    name: The Basement Server Room
    cell: malmo
    description: "A fan-roaring cellar of humming racks beneath a dead shopfront."
  - id: malmo-police
    name: Police Headquarters
    cell: malmo
    description: "A strip-lit night office that smells of cold coffee and old paper."
  - id: malmo-stortorget
    name: Stortorget
    cell: malmo
    description: "Malmö's vast main square, a bronze king on horseback at its centre."
  - id: malmo-lilla-torg
    name: Lilla Torg
    cell: malmo
    description: "A small timbered square of shuttered bars off the main one."
  - id: malmo-castle
    name: Malmöhus Castle
    cell: malmo
    description: "A squat moated fortress and former prison, black water in the moat."
  - id: malmo-turning-torso
    name: The Turning Torso
    cell: malmo
    description: "A tower that twists as it rises over the Western Harbour."
  - id: malmo-pildamms
    name: Pildammsparken
    cell: malmo
    description: "A dark lakeside park of reeds and paths that double back on you."
  - id: malmo-cemetery
    name: The Old Cemetery
    cell: malmo
    description: "Gamla kyrkogården: leaning stones and fog pooling between the limes."
  - id: malmo-citytunnel
    name: Triangeln Station
    cell: malmo
    description: "A deep underground platform, tiled and silent, far below the streets."

nodes:
  - id: malmo-harbor
    arc: main
    type: location
    location: malmo-harbor
    title: The Harbour
    world_access: true
    media: {image_theme: harbor-night, music_theme: distant-trains}
    body: "Malmö's old harbour. Cranes stand black against the Öresund and the water slaps at the quay. A road runs back inland toward Lund."
    edges:
      - id: e-harbor-lockers
        to: malmo-locker
        label: Search the harbour lockers
        effects: {progress_points: 5, log: "You went to the harbour lockers."}

  - id: malmo-locker
    arc: main
    type: puzzle
    location: malmo-locker
    title: Harbour Lockers
    puzzle: harbor-locker
    media: {image_theme: harbor-night, music_theme: low-dread}
    body: "Most lockers hang open and empty. One is held by a word-lock — five letter dials."
    edges:
      - id: e-locker-opened
        to: malmo-harbor
        label: Take what's inside and go
        conditions: {all: [{puzzle_solved: harbor-locker}]}
        effects: {progress_points: 20, log: "Inside the locker: a child's photograph you almost recognize."}
      - id: e-locker-back
        to: malmo-harbor
        label: Step back to the quay
        effects: {log: "You stepped back to the quay."}
        sort_order: 9

  # --- Zoltan Ibrahimson: Rosengård ---
  - id: malmo-rosengard
    arc: main
    type: gate
    location: malmo-rosengard
    title: Rosengård
    gate: malmo-zoltan
    media: {image_theme: estate-floodlight, music_theme: night-bass}
    body: "Concrete towers box in a floodlit cage pitch where a ball still cracks off the boards after midnight. An enormous ponytailed man holds the court alone, scarred eyebrow, expensive coat thrown over the fence. He nutmegs an invisible defender and grins at you. \"You came to Zoltan's part of town. Brave. Or lost.\" (Show some spine — he has no use for grovelling.)"
    edges:
      - id: e-rosengard-harbor
        to: malmo-harbor
        label: Head back down toward the harbour
        effects: {log: "You left Rosengård."}
        sort_order: 9

  # --- Lisbet Salamander: the server basement ---
  - id: malmo-server-basement
    arc: main
    type: gate
    location: malmo-server-basement
    title: The Basement Server Room
    gate: malmo-lisbet
    media: {image_theme: server-glow, music_theme: fan-hum}
    body: "Behind a dead shopfront, stairs drop into a roar of cooling fans and racks blinking green in the dark. A small wiry woman sits cross-legged before six screens, headphones on, a salamander inked up her neck. She doesn't turn. \"I already know your login, your debt, and the time you got here. Say something I don't know, fast.\" (Be direct — she despises wasted time.)"
    edges:
      - id: e-basement-harbor
        to: malmo-harbor
        label: Back up the stairs to the street
        effects: {log: "You left the basement and its screens."}
        sort_order: 9

  # --- Kurt Vallmo: police HQ ---
  - id: malmo-police
    arc: main
    type: gate
    location: malmo-police
    title: Police Headquarters
    gate: malmo-vallmo
    media: {image_theme: night-office, music_theme: low-dread}
    body: "One window still burns on the upper floor of the police house. Inside, a heavy, rumpled detective sits alone at a desk drowned in folders, a murder board behind him stuck with a single old case. He doesn't get up; his stomach growls into the quiet. \"We're closed. But you've got the look of somebody who knows something I've been chewing on for years. Sit.\" (Be straight with him — he's too tired for games.)"
    edges:
      - id: e-police-harbor
        to: malmo-harbor
        label: Leave the detective to his folders
        effects: {log: "You left the police house."}
        sort_order: 9

  # --- atmosphere ---
  - id: malmo-stortorget
    arc: main
    type: location
    location: malmo-stortorget
    title: Stortorget
    media: {image_theme: empty-square-night, music_theme: wind-cold}
    body: "The great square opens out, far too large for the few lit windows around it. A bronze king rides his bronze horse at the centre, green with age, facing nothing. Wind comes straight off the water and worries at the flags. Smaller streets lead off toward a older, tighter square."
    edges:
      - id: e-stortorget-harbor
        to: malmo-harbor
        label: Back toward the harbour road
        effects: {log: "You left Stortorget."}
        sort_order: 9
      - id: e-stortorget-lilla
        to: malmo-lilla-torg
        label: Slip into the little timbered square
        effects: {progress_points: 3, log: "You crossed to Lilla Torg."}

  - id: malmo-lilla-torg
    arc: main
    type: location
    location: malmo-lilla-torg
    title: Lilla Torg
    media: {image_theme: timbered-square, music_theme: distant-laughter}
    body: "Crooked timbered houses lean over a cobbled square of shuttered bars and stacked, chained chairs. Somewhere a knot of laughter rises — and stops the moment you look for it. Heat-lamps stand cold. The big square is back the way you came."
    edges:
      - id: e-lilla-stortorget
        to: malmo-stortorget
        label: Back out to the great square
        effects: {log: "You returned to Stortorget."}
        sort_order: 9

  - id: malmo-castle
    arc: main
    type: location
    location: malmo-castle
    title: Malmöhus Castle
    media: {image_theme: moated-fortress, music_theme: dread-drone}
    body: "The fortress squats low behind its moat, more prison than palace, its brick the colour of dried blood under the floodlights. Black water rings it without a ripple. A footbridge crosses to a gate that is, just slightly, ajar. You think of everyone this place was built to keep in."
    edges:
      - id: e-castle-harbor
        to: malmo-harbor
        label: Recross the bridge and go
        effects: {log: "You left the castle behind its moat."}
        sort_order: 9

  - id: malmo-turning-torso
    arc: main
    type: location
    location: malmo-turning-torso
    title: The Turning Torso
    media: {image_theme: twisting-tower, music_theme: high-cold}
    body: "Out at the Western Harbour a white tower screws up into the low cloud, each storey wrung a little further round than the last, as if something had taken the building and slowly twisted it. Every window is dark but one, very high up, where a light moves once and is still. The wind off the sound is bitter."
    edges:
      - id: e-torso-harbor
        to: malmo-harbor
        label: Turn back from the water's edge
        effects: {log: "You left the twisting tower."}
        sort_order: 9

  - id: malmo-pildamms
    arc: main
    type: location
    location: malmo-pildamms
    title: Pildammsparken
    media: {image_theme: dark-park-lake, music_theme: reeds-wind}
    body: "Gravel paths wind into a park grown too dark, reeds hissing at the edge of a black lake. You follow a path you're sure you've walked already and it sets you down somewhere new. The lamps are spaced just too far apart. Water lies flat and waiting between the trees."
    edges:
      - id: e-pildamms-harbor
        to: malmo-harbor
        label: Find your way back out of the park
        effects: {log: "You left the park, eventually."}
        sort_order: 9

  - id: malmo-cemetery
    arc: main
    type: location
    location: malmo-cemetery
    title: The Old Cemetery
    media: {image_theme: foggy-graveyard, music_theme: funeral-cold}
    body: "The old cemetery runs on under rows of limes, its stones leaning together like people sharing a secret. Fog pools in the hollows and gives the names back to you one at a time. Some plots are tended fresh; you do not see by whom. The gate to the living streets is somewhere behind you."
    edges:
      - id: e-cemetery-harbor
        to: malmo-harbor
        label: Back through the gate to the streets
        effects: {log: "You left the old cemetery."}
        sort_order: 9

  - id: malmo-citytunnel
    arc: main
    type: location
    location: malmo-citytunnel
    title: Triangeln Station
    media: {image_theme: deep-platform, music_theme: tunnel-hum}
    body: "An escalator carries you far down into the earth to a tiled platform lit white and even, utterly silent. The departures sign holds a single train, due in one minute, that the minute never reaches. Warm air pushes out of the tunnel mouth as if something large just exhaled. The way up is a long bright climb."
    edges:
      - id: e-citytunnel-harbor
        to: malmo-harbor
        label: Ride the long escalator back up
        effects: {log: "You climbed back up out of the tunnel."}
        sort_order: 9

puzzles:
  - id: harbor-locker
    type: set
    prompt: "A five-letter word-lock. What word fits?"
    solution: {kind: set, set: [SANDBY, SKANE, SKÅNE]}
    hint_ladder:
      - "A place name. Five letters."
      - "Somewhere this all began."
      - "Try SANDBY."
    on_solve: {progress_points: 30, set_flag: opened_harbor_locker, log: "The word-lock springs open."}

# Standalone edges off the harbour hub (malmo-harbor, world_access).
edges:
  - id: e-harbor-rosengard
    from: malmo-harbor
    to: malmo-rosengard
    label: Take the road up to the Rosengård estates
    effects: {progress_points: 5, log: "You went up to Rosengård."}
    sort_order: 2
  - id: e-harbor-basement
    from: malmo-harbor
    to: malmo-server-basement
    label: Find the stair behind the dead shopfront
    effects: {progress_points: 5, log: "You found the basement server room."}
    sort_order: 3
  - id: e-harbor-police
    from: malmo-harbor
    to: malmo-police
    label: Go to the one lit window of the police house
    effects: {progress_points: 5, log: "You went to the police house."}
    sort_order: 4
  - id: e-harbor-stortorget
    from: malmo-harbor
    to: malmo-stortorget
    label: Walk inland to the great square
    effects: {progress_points: 5, log: "You reached Stortorget."}
    sort_order: 5
  - id: e-harbor-castle
    from: malmo-harbor
    to: malmo-castle
    label: Cross to the moated castle
    effects: {progress_points: 5, log: "You reached Malmöhus castle."}
    sort_order: 6
  - id: e-harbor-torso
    from: malmo-harbor
    to: malmo-turning-torso
    label: Follow the quay out to the twisting tower
    effects: {progress_points: 5, log: "You reached the Turning Torso."}
    sort_order: 7
  - id: e-harbor-pildamms
    from: malmo-harbor
    to: malmo-pildamms
    label: Head inland to the dark lakeside park
    effects: {progress_points: 5, log: "You entered Pildammsparken."}
    sort_order: 8
  - id: e-harbor-cemetery
    from: malmo-harbor
    to: malmo-cemetery
    label: Cut through the old cemetery
    effects: {progress_points: 5, log: "You entered the old cemetery."}
    sort_order: 9
  - id: e-harbor-citytunnel
    from: malmo-harbor
    to: malmo-citytunnel
    label: Ride the escalator down to the deep platform
    effects: {progress_points: 5, log: "You went down to Triangeln station."}
    sort_order: 10

gates:
  - id: malmo-zoltan
    location: malmo-rosengard
    character: zoltan_ibrahimson
    intent: Earn the big man's respect so he gives you a name moving through the harbour.
    criteria:
      - {id: showed_spine, desc: "Player stands up to him with confidence or humour — neither grovels nor disrespects him."}
      - {id: asked_for_help, desc: "Player asks him for a name, for help, or about what moves through the harbour."}
    success_rule: "showed_spine AND asked_for_help"
    knowledge_boundary:
      knows:
        - "he knows everyone in Malmö and who moves what through the old harbour"
        - "a name connected to the locked harbour locker, and that it leads back toward Sandby"
      refuses:
        - "the debts people owe him"
        - "the larger mystery of why the stranger is here"
      tone: "booming, boastful, third person ('Zoltan does not wait'); the bragging hides real loyalty"
    hint_ladder:
      - "He keeps the ball moving and watches how you carry yourself."
      - "\"Zoltan helps people he respects. So — do you flinch, or do you talk?\""
      - "\"You want the harbour locker. Zoltan knows the name on it. Stand up straight, ask Zoltan properly, and it's yours.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_zoltan
      story_node_next: malmo-rosengard
      log: "Zoltan respected you enough to hand over the name on the harbour locker."
      write_memory: {owner: zoltan_ibrahimson, content: "A stranger came to Rosengård with spine, so Zoltan gave them the name on the harbour locker — the one that leads back to Sandby.", leakable: true}

  - id: malmo-lisbet
    location: malmo-server-basement
    character: lisbet_salamander
    intent: Give the hacker a reason not to throw you out, and learn what she dug up on the 1998 fire.
    criteria:
      - {id: was_direct, desc: "Player gets to the point — no small talk, no flattery, no wasting her time."}
      - {id: offered_trade_or_question, desc: "Player offers a real trade or asks a precise, specific question."}
    success_rule: "was_direct AND offered_trade_or_question"
    knowledge_boundary:
      knows:
        - "she pulled the records on the 1998 school fire and a name had been scrubbed from the file by someone official"
        - "she can find anyone from almost nothing — including who the stranger has been"
      refuses:
        - "her methods and her sources"
        - "the larger mystery of why the stranger is here"
      tone: "clipped, distrustful, scalding when she does open up; hates small talk and flattery"
    hint_ladder:
      - "She keeps typing, one eyebrow up, waiting for you to bore her."
      - "\"Trade or question. Pick one. Don't make me wait.\""
      - "\"The 1998 fire file? Somebody scrubbed a name out of it. Give me something real and I'll tell you whose it was.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_lisbet
      story_node_next: malmo-server-basement
      log: "Lisbet showed you the scrubbed name in the 1998 fire file."
      write_memory: {owner: lisbet_salamander, content: "A stranger was direct enough not to annoy me, so I showed them the name someone scrubbed out of the 1998 school-fire file.", leakable: true}

  - id: malmo-vallmo
    location: malmo-police
    character: kurt_vallmo
    intent: Win the tired detective's trust so he tells you about the case he never closed and the missing fire file.
    criteria:
      - {id: was_straight, desc: "Player is honest and patient with him, not evasive or pushy."}
      - {id: asked_about_case, desc: "Player asks about an old case, the disappearance, or the 1998 fire."}
    success_rule: "was_straight AND asked_about_case"
    knowledge_boundary:
      knows:
        - "the Lund disappearance he was made to drop, and that he never believed it was nothing"
        - "the 1998 school-fire file was signed out of the archive and never came back"
      refuses:
        - "naming a suspect he can't prove"
        - "the larger mystery of why the stranger is here"
      tone: "tired, blunt, melancholic; circles the same question until something cracks; mutters in Scanian"
    hint_ladder:
      - "He rubs his eyes and waits to see if you're worth the coffee he's not offering."
      - "\"Be straight with me. I've had thirty years of people who weren't.\""
      - "\"There was a disappearance in Lund they made me drop. And the '98 fire file — somebody signed it out and it never came back. Ask me plain and I'll tell you what I kept.\""
    mercy_after_attempts: 6
    on_success:
      progress_points: 50
      set_flag: met_vallmo
      story_node_next: malmo-police
      log: "Vallmo told you about the case he never closed and the fire file that vanished."
      write_memory: {owner: kurt_vallmo, content: "A stranger was straight with me, so I told them about the Lund disappearance I was made to drop and the 1998 fire file that was signed out and never returned.", leakable: true}
